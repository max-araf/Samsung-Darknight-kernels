name: Build SM-A135F Darknight 4.19.325 (OriginSU v4.2.6 35397 + SUSFS v2.3.0 + Tweaks)

on:
  workflow_dispatch:
    inputs:
      ksu_manager_package:
        description: "OriginSU Manager package name"
        required: true
        default: "com.originsu.manager"
      ksu_manager_size:
        description: "OriginSU Manager v2 signature block size (hex)"
        required: true
        default: "0x51c"
      ksu_manager_hash:
        description: "OriginSU Manager v2 certificate SHA-256"
        required: true
        default: "d91ed440459ff575f9bbdb0b294f8d679b1591a37538aafcf1d0073da5dbe968"
  push:
    branches:
      - main
      - lineage-24.0

permissions:
  contents: read

concurrency:
  group: a13x-darknight-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: "https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git"
  KERNEL_BRANCH: "lineage-24.0"
  DEFCONFIG: "exynos850-a13nsxx_defconfig"
  ARCH: "arm64"
  CROSS_COMPILE: "aarch64-linux-gnu-"
  LLVM: "1"
  LLVM_IAS: "1"
  EXPECTED_KERNEL_VERSION: "4.19.325"
  EXPECTED_KERNEL_RELEASE: "4.19.325-Darknight"
  NEUTRON_TAG: "06092026"
  ORIGINSU_RELEASE_URL: "https://github.com/samakshkambxj/OriginSU/releases/tag/v4.2.6"
  ORIGINSU_TAG: "v4.2.6"
  ORIGINSU_FULL_VERSION: "v4.2.6-f9d89712@OriginSU"
  ORIGINSU_VERSION: "35397"
  ORIGINSU_UAPI_VERSION: "6"
  KSU_REPO: "KernelSU-Next/KernelSU-Next"
  KSUNEXT_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSUNEXT_COMMIT: "8f902aeb16033024143ae36cf711df902cf02fae"
  EXPECTED_KSU_COMMIT: "8f902aeb16033024143ae36cf711df902cf02fae"
  KSUNEXT_TAG: "v4.2.6"
  KSUNEXT_VERSION: "35397"
  KSU_LEGACY_SELINUX_COMPAT_REF: "d51ca52c6d370d8e9d62aabde10e41f17ff3ae94"
  KSU_MANAGER_PACKAGE: "com.originsu.manager"
  KSU_NEXT_MANAGER_SIZE: "0x51c"
  KSU_NEXT_MANAGER_HASH: "d91ed440459ff575f9bbdb0b294f8d679b1591a37538aafcf1d0073da5dbe968"
  BRENE_REPO: "https://github.com/rrr333nnn333/BRENE.git"
  BRENE_COMMIT_PREFIX: "d721c6a"
  SUSFS4KSU_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS4KSU_MIRROR: "https://github.com/Star-Seven/susfs4ksu.git"
  SUSFS4KSU_BRANCH: "kernel-4.19"
  SUSFS4KSU_COMMIT_PREFIX: "001e6991"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

jobs:
  build-sm-a135f-originsu-susfs:
    name: Build Darknight 4.19.325 (OriginSU v4.2.6 35397 + SUSFS v2.3.0 + Tweaks)
    # CRITICAL: Neutron Clang 24 (06092026) requires GLIBC_2.36, GLIBC_2.38, and
    # GLIBC_ABI_DT_RELR, which are natively provided by Ubuntu 24.04 (glibc 2.39).
    # Ubuntu 22.04 only ships glibc 2.35 and fails to execute clang.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Maximize runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl \
            device-tree-compiler dwarves file flex gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu git jq kmod libelf-dev libncurses-dev \
            libssl-dev lz4 openssl pahole patchelf python3 python-is-python3 \
            python3-yaml rsync shellcheck unzip wget xz-utils zip zstd

      - name: Checkout repository and preserve existing workflow backup
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: A. Inventory repository, preserve original workflow, and ensure kernel tree
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          mkdir -p "${DIAG_DIR}/workflow-backup" "${DIAG_DIR}/patches"

          if [ -f "${GITHUB_WORKSPACE}/.github/workflows/main.yml" ]; then
            cp -f "${GITHUB_WORKSPACE}/.github/workflows/main.yml" \
              "${DIAG_DIR}/workflow-backup/main.yml.backup"
          fi

          git status --short --branch > "${DIAG_DIR}/git-status-initial.txt" || true
          git log -n 5 --oneline > "${DIAG_DIR}/git-log-initial.txt" || true

          if [ ! -f "${GITHUB_WORKSPACE}/Makefile" ] || [ ! -f "${GITHUB_WORKSPACE}/arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "Checked-out repo does not contain kernel root; cloning ${KERNEL_REPO} (${KERNEL_BRANCH})..."
            rm -rf "${GITHUB_WORKSPACE}/kernel_src"
            git clone --depth=50 -b "${KERNEL_BRANCH}" "${KERNEL_REPO}" "${GITHUB_WORKSPACE}/kernel_src"
            rsync -a --exclude='.git' --exclude='diagnostics' --exclude='.github' \
              "${GITHUB_WORKSPACE}/kernel_src/" "${GITHUB_WORKSPACE}/"
            git -C "${GITHUB_WORKSPACE}/kernel_src" rev-parse HEAD > "${DIAG_DIR}/kernel-source-commit.txt"
            rm -rf "${GITHUB_WORKSPACE}/kernel_src"
          else
            git rev-parse HEAD > "${DIAG_DIR}/kernel-source-commit.txt"
          fi

          find "${GITHUB_WORKSPACE}" -maxdepth 2 -not -path '*/.*' | sort > "${DIAG_DIR}/repo-inventory.txt"

      - name: B. Verify kernel source version, defconfig, and setup Neutron Clang 24
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          exec > >(tee -a "${DIAG_DIR}/toolchain-install.log") 2>&1
          cd "${GITHUB_WORKSPACE}"

          test -f "arch/arm64/configs/${DEFCONFIG}"
          KVER="$(make -s kernelversion)"
          echo "Detected make kernelversion: ${KVER}"
          if [ "${KVER}" != "${EXPECTED_KERNEL_VERSION}" ]; then
            echo "ERROR: Expected kernelversion ${EXPECTED_KERNEL_VERSION}, got ${KVER}" >&2
            exit 1
          fi

          echo "Host glibc version:"
          ldd --version | head -n 2 || true

          API_URL="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/tags/${NEUTRON_TAG}"
          ASSET_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${NEUTRON_TAG}/neutron-clang-${NEUTRON_TAG}.tar.zst"
          if curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' "${API_URL}" \
            -o "${RUNNER_TEMP}/neutron-release.json" 2>/dev/null; then
            PARSED_URL="$(jq -r '[.assets[] | select(.name | endswith(".tar.zst"))][0].browser_download_url // empty' "${RUNNER_TEMP}/neutron-release.json")"
            if [ -n "${PARSED_URL}" ] && [ "${PARSED_URL}" != "null" ]; then
              ASSET_URL="${PARSED_URL}"
            fi
          fi

          CLANG_DIR="${RUNNER_TEMP}/neutron-clang"
          rm -rf "${CLANG_DIR}"
          mkdir -p "${CLANG_DIR}"
          curl -fL --retry 5 --retry-delay 5 "${ASSET_URL}" -o "${RUNNER_TEMP}/neutron-clang.tar.zst"
          tar --zstd -xf "${RUNNER_TEMP}/neutron-clang.tar.zst" -C "${CLANG_DIR}"
          rm -f "${RUNNER_TEMP}/neutron-clang.tar.zst"

          CLANG_BIN=""
          for candidate in clang clang-24 clang-24.0 clang-24.0.0 clang-24.0.0git; do
            CLANG_BIN="$(find "${CLANG_DIR}" \( -type f -o -type l \) -path '*/bin/*' -name "${candidate}" -print -quit)"
            [ -n "${CLANG_BIN}" ] && break
          done
          if [ -z "${CLANG_BIN}" ] || [ ! -x "${CLANG_BIN}" ]; then
            echo "ERROR: Could not locate executable clang inside Neutron release asset." >&2
            exit 1
          fi

          TOOLCHAIN_BIN="$(dirname "${CLANG_BIN}")"
          if [ "$(basename "${CLANG_BIN}")" != "clang" ]; then
            ln -sfn "$(basename "${CLANG_BIN}")" "${TOOLCHAIN_BIN}/clang"
          fi

          for tool in clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-ranlib llvm-size llvm-strings llvm-cov; do
            if [ ! -x "${TOOLCHAIN_BIN}/${tool}" ]; then
              for suffix in -24 -24.0 -24.0.0 -24.0.0git; do
                if [ -x "${TOOLCHAIN_BIN}/${tool}${suffix}" ]; then
                  ln -sfn "${tool}${suffix}" "${TOOLCHAIN_BIN}/${tool}"
                  break
                fi
              done
            fi
          done
          if [ ! -x "${TOOLCHAIN_BIN}/clang++" ]; then
            ln -sfn "$(basename "${CLANG_BIN}")" "${TOOLCHAIN_BIN}/clang++"
          fi

          # If the runner's host glibc is ever older than 2.38, apply Neutron's official glibc patch
          if ! "${TOOLCHAIN_BIN}/clang" --version >/dev/null 2>&1; then
            echo "Host glibc lacks required symbol versions; applying Neutron antman --patch=glibc..."
            cd "${CLANG_DIR}"
            curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
            chmod +x antman
            ./antman --patch=glibc
            cd "${GITHUB_WORKSPACE}"
          fi

          "${TOOLCHAIN_BIN}/clang" --version | tee "${DIAG_DIR}/compiler-version.txt"
          "${TOOLCHAIN_BIN}/ld.lld" --version | tee -a "${DIAG_DIR}/compiler-version.txt"
          grep -Eq 'version 24\.0\.0git' "${DIAG_DIR}/compiler-version.txt" || {
            echo "ERROR: Expected Clang 24.0.0git from tag ${NEUTRON_TAG}" >&2
            exit 1
          }
          echo "${TOOLCHAIN_BIN}" >> "${GITHUB_PATH}"
          echo "CLANG_DIR=${CLANG_DIR}" >> "${GITHUB_ENV}"

      - name: C & E. Fetch and audit OriginSU v4.2.6 (35397) + SUSFS v2.3.0 repositories
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          # 1. Clone and pin KernelSU-Next via official setup.sh at exact commit 8f902aeb16033024143ae36cf711df902cf02fae
          rm -rf KernelSU-Next drivers/kernelsu
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${KSU_REPO}/${KSUNEXT_COMMIT}/kernel/setup.sh" \
            -o "${RUNNER_TEMP}/ksu-setup.sh"
          bash "${RUNNER_TEMP}/ksu-setup.sh" "${KSUNEXT_COMMIT}" 2>&1 | tee "${DIAG_DIR}/ksu-setup.log"

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Kbuild
          test -d KernelSU-Next/.git
          test -s KernelSU-Next/uapi/supercall.h

          ACTUAL_KSU_SHA="$(git -C KernelSU-Next rev-parse HEAD)"
          if [ "${ACTUAL_KSU_SHA}" != "${KSUNEXT_COMMIT}" ]; then
            echo "ERROR: KernelSU-Next commit mismatch: ${ACTUAL_KSU_SHA} != ${KSUNEXT_COMMIT}" >&2
            exit 1
          fi
          KSU_REV_COUNT="$(git -C KernelSU-Next rev-list --count HEAD)"
          KSU_CALC_VER="$((30000 + KSU_REV_COUNT))"
          echo "KernelSU-Next SHA: ${ACTUAL_KSU_SHA}" | tee "${DIAG_DIR}/ksunext-source-audit.txt"
          echo "KernelSU-Next rev-count: ${KSU_REV_COUNT} -> version ${KSU_CALC_VER}" | tee -a "${DIAG_DIR}/ksunext-source-audit.txt"
          if [ "${KSU_CALC_VER}" != "33333" ]; then
            echo "ERROR: Expected KernelSU-Next version 33333, got ${KSU_CALC_VER}" >&2
            exit 1
          fi
          find KernelSU-Next/kernel -maxdepth 3 -type f | sort >> "${DIAG_DIR}/ksunext-source-audit.txt"

          # Verify real files in pinned commit 8f902aeb16033024143ae36cf711df902cf02fae
          for req_file in \
            KernelSU-Next/kernel/Kconfig \
            KernelSU-Next/kernel/Kbuild \
            KernelSU-Next/kernel/core/init.c \
            KernelSU-Next/kernel/supercall/supercall.c \
            KernelSU-Next/kernel/supercall/dispatch.c \
            KernelSU-Next/kernel/hook/setuid_hook.c \
            KernelSU-Next/kernel/hook/syscall_hook_manager.c \
            KernelSU-Next/kernel/hook/syscall_event_bridge.c \
            KernelSU-Next/kernel/hook/arm64/patch_memory.c \
            KernelSU-Next/kernel/hook/arm64/syscall_hook.c \
            KernelSU-Next/kernel/runtime/ksud_integration.c \
            KernelSU-Next/kernel/runtime/boot_event.c \
            KernelSU-Next/kernel/feature/sucompat.c \
            KernelSU-Next/kernel/feature/kernel_umount.c \
            KernelSU-Next/kernel/manager/apk_sign.c \
            KernelSU-Next/kernel/manager/throne_tracker.c \
            KernelSU-Next/kernel/selinux/rules.c; do
            if [ ! -f "${req_file}" ]; then
              echo "ERROR: Missing expected file ${req_file} in KernelSU-Next ${KSUNEXT_COMMIT}" >&2
              exit 1
            fi
          done

          # 2. Clone and audit user-supplied rrr333nnn333/BRENE repository
          rm -rf "${RUNNER_TEMP}/brene-src"
          git clone "${BRENE_REPO}" "${RUNNER_TEMP}/brene-src"
          cd "${RUNNER_TEMP}/brene-src"
          if git rev-parse --verify "${BRENE_COMMIT_PREFIX}^{commit}" >/dev/null 2>&1; then
            git checkout --detach "${BRENE_COMMIT_PREFIX}"
          fi
          BRENE_SHA="$(git rev-parse HEAD)"
          {
            echo "=== User-Supplied Repository Audit: ${BRENE_REPO} ==="
            echo "Pinned Commit SHA: ${BRENE_SHA}"
            echo "Branches:"
            git branch -a
            echo "Recent Commits:"
            git log -n 5 --oneline
            echo "Tracked Files:"
            git ls-files
            echo "C/Header/Patch file count:"
            git ls-files | grep -E '\.(c|h|patch|diff)$' | wc -l || true
            echo "Conclusion: rrr333nnn333/BRENE is a userspace KernelSU module (AGPL-3.0) that wraps ksu_susfs and requires kernel-side susfs4ksu patches."
          } > "${DIAG_DIR}/susfs-brene-audit.txt"
          echo "BRENE_SHA=${BRENE_SHA}" >> "${GITHUB_ENV}"
          cd "${GITHUB_WORKSPACE}"

          # 3. Clone and pin kernel-side simonpunk/susfs4ksu (branch kernel-4.19)
          rm -rf "${RUNNER_TEMP}/susfs4ksu-src"
          if ! git clone -b "${SUSFS4KSU_BRANCH}" "${SUSFS4KSU_REPO}" "${RUNNER_TEMP}/susfs4ksu-src"; then
            echo "Primary GitLab clone failed; falling back to GitHub mirror ${SUSFS4KSU_MIRROR}..."
            git clone -b "${SUSFS4KSU_BRANCH}" "${SUSFS4KSU_MIRROR}" "${RUNNER_TEMP}/susfs4ksu-src"
          fi
          cd "${RUNNER_TEMP}/susfs4ksu-src"
          git checkout --detach "${SUSFS4KSU_COMMIT_PREFIX}"
          SUSFS4KSU_SHA="$(git rev-parse HEAD)"
          {
            echo "=== Kernel-Side SUSFS Repository Audit: simonpunk/susfs4ksu (${SUSFS4KSU_BRANCH}) ==="
            echo "Pinned Commit SHA: ${SUSFS4KSU_SHA}"
            git log -n 5 --oneline
            echo "Kernel Patch Files:"
            find kernel_patches -type f | sort
          } > "${DIAG_DIR}/susfs4ksu-audit.txt"
          echo "SUSFS4KSU_SHA=${SUSFS4KSU_SHA}" >> "${GITHUB_ENV}"
          cd "${GITHUB_WORKSPACE}"

      - name: D1. Apply verified Linux 4.19.325 VFS, seccomp, mount, and SELinux non-GKI compatibility patches
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          # 1. VFS file_wrapper.c compatibility for Samsung 4.19.325
          python3 - "KernelSU-Next/kernel/infra/file_wrapper.c" <<'PYVFS'
          from pathlib import Path
          import re, sys

          path = Path(sys.argv[1])
          src = path.read_text()
          src, n1 = re.subn(
              r'#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6, 1, 0\)\n'
              r'static int ksu_wrapper_iopoll\b.*?^#endif[ \t]*\n',
              '', src, count=1, flags=re.S | re.M
          )
          src, n2 = re.subn(
              r'^\s*p->ops\.iopoll = fp->f_op->iopoll \? ksu_wrapper_iopoll : NULL;\s*\n',
              '', src, count=1, flags=re.M
          )
          src, n3 = re.subn(
              r'^// no REMAP_FILE_DEDUP: use file_in\n.*?(?=^static int ksu_wrapper_fadvise\b)',
              '', src, count=1, flags=re.S | re.M
          )
          src, n4 = re.subn(
              r'^\s*p->ops\.remap_file_range =\n'
              r'\s*fp->f_op->remap_file_range \? ksu_wrapper_remap_file_range : NULL;\s*\n',
              '', src, count=1, flags=re.M
          )
          assert (n1, n2, n3, n4) == (1, 1, 1, 1), f"Unexpected VFS wrapper counts: {(n1, n2, n3, n4)}"
          path.write_text(src)
          print("Applied 4.19 VFS compatibility patch to file_wrapper.c")
          PYVFS

          # 2. seccomp_cache.c compatibility for Linux 4.19
          python3 - "KernelSU-Next/kernel/infra/seccomp_cache.c" <<'PYSECCOMP'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          src = path.read_text()
          prefix = """/* DARKNIGHT_LEGACY_SECCOMP_CACHE_STUBS */
          #include <linux/version.h>
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 15, 0)
          #include <linux/seccomp.h>
          #include "infra/seccomp_cache.h"

          void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr)
          {
              (void)filter;
              (void)nr;
          }

          void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr)
          {
              (void)filter;
              (void)nr;
          }
          #else
          """
          suffix = "\n#endif /* LINUX_VERSION_CODE < KERNEL_VERSION(5, 15, 0) */\n"
          path.write_text(prefix + src + suffix)
          print("Applied Linux 4.19 seccomp_cache.c stubs")
          PYSECCOMP

          # 3. su_mount_ns.c mount header fallback for Linux 4.19
          python3 - "KernelSU-Next/kernel/infra/su_mount_ns.c" <<'PYMOUNT'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '#include <uapi/linux/mount.h>'
          new = (
              '/* DARKNIGHT_MOUNT_FLAGS_HEADER_FALLBACK */\n'
              '#if __has_include(<uapi/linux/mount.h>)\n'
              '#include <uapi/linux/mount.h>\n'
              '#else\n'
              '#include <uapi/linux/fs.h>\n'
              '#endif\n'
          )
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          print("Applied su_mount_ns.c mount header fallback")
          PYMOUNT

          # 4. Linux 4.19 TWA_RESUME, fsnotify_ops, seccomp filter_count/put_seccomp_filter, minmax.h, sched headers
          python3 - <<'PYKSU419'
          from pathlib import Path
          import re

          KSU = Path('KernelSU-Next/kernel')

          twa_macro = (
              '\n/* DARKNIGHT_LINUX419_TWA_RESUME_COMPAT */\n'
              '#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)\n'
              '#ifndef TWA_RESUME\n#define TWA_RESUME 1\n#endif\n#endif\n'
          )
          for rel in ('manager/pkg_observer.c', 'policy/allowlist.c', 'supercall/supercall.c'):
              p = KSU / rel
              text = p.read_text()
              if '#include <linux/version.h>' not in text:
                  lines = text.splitlines(keepends=True)
                  insert_at = 1 if lines and lines[0].startswith('// SPDX-License-Identifier:') else 0
                  lines.insert(insert_at, '#include <linux/version.h>\n')
                  text = ''.join(lines)
              text = text.replace('#include <linux/version.h>\n', '#include <linux/version.h>\n' + twa_macro, 1)
              if '#include <linux/task_work.h>' not in text:
                  text = text.replace('#include <linux/version.h>\n', '#include <linux/task_work.h>\n#include <linux/version.h>\n', 1)
              p.write_text(text)

          p = KSU / 'policy/allowlist.c'
          text = p.read_text()
          if '#include <linux/sched/task.h>' not in text:
              text = text.replace('#include <linux/task_work.h>\n', '#include <linux/task_work.h>\n#include <linux/sched/task.h>\n', 1)
              p.write_text(text)

          p = KSU / 'manager/pkg_observer.c'
          text = p.read_text()
          if '#include <linux/string.h>' not in text:
              text = text.replace('#include <linux/slab.h>\n', '#include <linux/slab.h>\n#include <linux/string.h>\n', 1)
          pattern = re.compile(r'^static const struct fsnotify_ops ksu_ops = \{\n.*?^\};\n', re.M | re.S)
          m = pattern.search(text)
          assert m, "fsnotify_ops not found in pkg_observer.c"
          new_ops = '''#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)
          /* DARKNIGHT_LINUX419_FSNOTIFY_COMPAT */
          static int ksu_handle_legacy_event(struct fsnotify_group *group,
                                            struct inode *inode, u32 mask,
                                            const void *data, int data_type,
                                            const unsigned char *file_name,
                                            u32 cookie,
                                            struct fsnotify_iter_info *iter_info)
          {
              (void)group; (void)inode; (void)data; (void)data_type; (void)cookie; (void)iter_info;
              if (!file_name || (mask & FS_ISDIR))
                  return 0;
              if (!strcmp((const char *)file_name, "packages.list")) {
                  pr_info("packages.list detected: %d\\n", mask);
                  ksu_defer_track_throne();
              }
              return 0;
          }
          static const struct fsnotify_ops ksu_ops = {
              .handle_event = ksu_handle_legacy_event,
          };
          #else
          static const struct fsnotify_ops ksu_ops = {
              .handle_inode_event = ksu_handle_inode_event,
          };
          #endif
          '''
          text = text[:m.start()] + new_ops + text[m.end():]
          p.write_text(text)

          p = KSU / 'policy/app_profile.c'
          text = p.read_text()
          needle = '    atomic_set(&current->seccomp.filter_count, 0);'
          assert text.count(needle) == 1
          text = text.replace(
              needle,
              '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n'
              '    /* DARKNIGHT_LINUX419_SECCOMP_FILTER_COUNT */\n'
              '    atomic_set(&current->seccomp.filter_count, 0);\n'
              '#endif',
              1,
          )
          decl = 'void seccomp_filter_release(struct task_struct *tsk);'
          assert text.count(decl) == 1
          text = text.replace(
              decl,
              '#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 6, 0)\n'
              'void seccomp_filter_release(struct task_struct *tsk);\n'
              '#endif',
              1,
          )
          call = '    seccomp_filter_release(fake);'
          assert text.count(call) == 1
          text = text.replace(
              call,
              '#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 6, 0)\n'
              '    seccomp_filter_release(fake);\n'
              '#else\n'
              '    /* DARKNIGHT_LINUX419_SECCOMP_RELEASE_COMPAT */\n'
              '    put_seccomp_filter(fake);\n'
              '#endif',
              1,
          )
          p.write_text(text)

          p = KSU / 'sulog/event.c'
          text = p.read_text()
          text = text.replace(
              '#include <linux/minmax.h>',
              '/* DARKNIGHT_LINUX419_MINMAX_COMPAT */\n'
              '#if __has_include(<linux/minmax.h>)\n#include <linux/minmax.h>\n#else\n#include <linux/kernel.h>\n#endif',
              1,
          )
          p.write_text(text)

          p = KSU / 'supercall/dispatch.c'
          text = p.read_text()
          missing = [f'#include <{h}>\n' for h in ('linux/sched/signal.h', 'linux/sched/task.h', 'linux/init_task.h') if f'#include <{h}>\n' not in text]
          lines = text.splitlines(keepends=True)
          insert_at = 1 if lines and lines[0].startswith('// SPDX-License-Identifier:') else 0
          lines[insert_at:insert_at] = ['/* DARKNIGHT_LINUX419_SCHED_HEADERS */\n'] + missing
          p.write_text(''.join(lines))
          print("Applied Linux 4.19 compatibility adaptations to KernelSU-Next")
          PYKSU419

          # 5. Add path_mount and path_umount to fs/namespace.c
          python3 - <<'PYPATHAPI'
          from pathlib import Path
          import re
          p = Path('fs/namespace.c')
          text = p.read_text()
          mount_anchor = re.compile(r'/\*\n[ \t]*\* do loopback mount\.\n[ \t]*\*/\n', re.M)
          mount_match = mount_anchor.search(text)
          assert mount_match
          mount_impl = '''/* DARKNIGHT_KERNELSU_PATH_MOUNT_COMPAT */
          int path_mount(const char *dev_name, struct path *path,
                         const char *type_page, unsigned long flags,
                         void *data_page)
          {
              int error;
              if (!path || !path->mnt || !path->dentry)
                  return -EINVAL;
              if (dev_name || type_page || data_page || flags != (MS_PRIVATE | MS_REC))
                  return -EOPNOTSUPP;
              error = security_sb_mount(dev_name, path, type_page, flags, data_page);
              if (error)
                  return error;
              if (!may_mount())
                  return -EPERM;
              return do_change_type(path, (int)flags);
          }

          '''
          text = text[:mount_match.start()] + mount_impl + text[mount_match.start():]
          umount_anchor = 'int ksys_umount(char __user *name, int flags)\n'
          assert text.count(umount_anchor) == 1
          umount_impl = '''/* DARKNIGHT_KERNELSU_PATH_UMOUNT_COMPAT */
          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt;
              int retval;
              if (!path || !path->mnt || !path->dentry)
                  return -EINVAL;
              mnt = real_mount(path->mnt);
              retval = -EINVAL;
              if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE))
                  goto dput_and_out;
              if (!may_mount()) {
                  retval = -EPERM;
                  goto dput_and_out;
              }
              if (path->dentry != path->mnt->mnt_root)
                  goto dput_and_out;
              if (!check_mnt(mnt))
                  goto dput_and_out;
              if (mnt->mnt.mnt_flags & MNT_LOCKED)
                  goto dput_and_out;
              retval = -EPERM;
              if ((flags & MNT_FORCE) && !capable(CAP_SYS_ADMIN))
                  goto dput_and_out;
              retval = do_umount(mnt, flags);
          dput_and_out:
              dput(path->dentry);
              mntput_no_expire(mnt);
              return retval;
          }

          '''
          text = text.replace(umount_anchor, umount_impl + umount_anchor, 1)
          p.write_text(text)
          print("Added path_mount/path_umount to fs/namespace.c")
          PYPATHAPI

          # 6. Backport maintained non-GKI SELinux compatibility files from d51ca52c6d370d8e9d62aabde10e41f17ff3ae94
          KSU_ROOT="${GITHUB_WORKSPACE}/KernelSU-Next"
          COMPAT_REF="${KSU_LEGACY_SELINUX_COMPAT_REF}"
          files=(
            kernel/compat/kernel_compat.c
            kernel/compat/kernel_compat.h
            kernel/selinux/rules.c
            kernel/selinux/selinux.c
            kernel/selinux/selinux.h
            kernel/selinux/sepolicy.c
            kernel/selinux/sepolicy.h
            kernel/feature/selinux_hide.c
            kernel/feature/selinux_hide.h
          )
          for rel in "${files[@]}"; do
            target="${KSU_ROOT}/${rel}"
            tmp="${RUNNER_TEMP}/ksu-legacy-$(basename "${rel}").tmp"
            url="https://raw.githubusercontent.com/${KSU_REPO}/${COMPAT_REF}/${rel}"
            mkdir -p "$(dirname "${target}")"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors "${url}" -o "${tmp}"
            install -m 0644 "${tmp}" "${target}"
            python3 - "${target}" <<'PYTRAIL'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = [line.rstrip(b" \t\r\n") + b"\n" for line in p.read_bytes().splitlines(keepends=True)]
          p.write_bytes(b"".join(lines))
          PYTRAIL
          done

          python3 - "${KSU_ROOT}/kernel/feature/selinux_hide.c" "${KSU_ROOT}/kernel/feature/selinux_hide.h" <<'PYBRIDGE'
          from pathlib import Path
          import sys
          c_path, h_path = map(Path, sys.argv[1:])
          c_src = c_path.read_text()
          h_src = h_path.read_text()
          header_anchor = 'void ksu_selinux_hide_exit();\n'
          h_src = h_src.replace(header_anchor, header_anchor + 'void ksu_selinux_hide_drop_backup_if_unused(void);\n', 1)
          c_src = c_src.rstrip() + '\n\nvoid ksu_selinux_hide_drop_backup_if_unused(void)\n{\n}\n'
          c_path.write_text(c_src)
          h_path.write_text(h_src)
          PYBRIDGE

          python3 - "${KSU_ROOT}/kernel/Kbuild" <<'PYKBUILD'
          from pathlib import Path
          import sys, textwrap
          p = Path(sys.argv[1])
          src = p.read_text()
          object_anchor = 'kernelsu-objs := core/init.o\n'
          src = src.replace(object_anchor, object_anchor + 'kernelsu-objs += compat/kernel_compat.o\n', 1)
          block = textwrap.dedent('''\
          # DARKNIGHT_LEGACY_SELINUX_COMPAT_PROBES
          ifeq ($(shell grep -q "current_sid(void)" $(srctree)/security/selinux/include/objsec.h; echo $$?),0)
          ccflags-y += -DKSU_COMPAT_HAS_CURRENT_SID
          endif
          ifeq ($(shell grep -q "struct selinux_state " $(srctree)/security/selinux/include/security.h; echo $$?),0)
          ccflags-y += -DKSU_COMPAT_USE_SELINUX_STATE
          endif
          ifeq ($(shell grep -q "^DEFINE_RWLOCK(policy_rwlock);" $(srctree)/security/selinux/ss/services.c; echo $$?),0)
          ccflags-y += -DKSU_COMPAT_HAS_EXPORTED_POLICY_RWLOCK
          endif
          ifeq ($(shell grep -q "cpus_ptr;" $(srctree)/include/linux/sched.h; echo $$?),0)
          ccflags-y += -DKSU_COMPAT_HAS_BACKPORTED_CPUS_PTR
          endif
          ifeq ($(shell grep -q "strncpy_from_user_nofault" $(srctree)/include/linux/uaccess.h; echo $$?),0)
          ccflags-y += -DKSU_OPTIONAL_STRNCPY
          endif
          ifeq ($(shell grep -q "ssize_t kernel_read" $(srctree)/fs/read_write.c; echo $$?),0)
          ccflags-y += -DKSU_OPTIONAL_KERNEL_READ
          endif
          ifeq ($(shell grep "ssize_t kernel_write" $(srctree)/fs/read_write.c | grep -q "const void"; echo $$?),0)
          ccflags-y += -DKSU_OPTIONAL_KERNEL_WRITE
          endif
          ifeq ($(shell grep -q "int path_mount" $(srctree)/fs/namespace.c; echo $$?),0)
          ccflags-y += -DKSU_HAS_PATH_MOUNT
          endif
          ifeq ($(shell grep -q "int path_umount" $(srctree)/fs/namespace.c; echo $$?),0)
          ccflags-y += -DKSU_HAS_PATH_UMOUNT
          endif
          ifneq ($(shell grep -wq "put_seccomp_filter" $(srctree)/kernel/seccomp.c $(srctree)/include/linux/seccomp.h; echo $$?),0)
          ifeq ($(shell grep -wq "seccomp_filter_release" $(srctree)/kernel/seccomp.c $(srctree)/include/linux/seccomp.h; echo $$?),0)
          ccflags-y += -DKSU_OPTIONAL_SECCOMP_FILTER_RELEASE
          endif
          endif
          ifeq ($(shell grep -q "security_inode_init_security_anon" $(srctree)/include/linux/security.h; echo $$?),0)
          ccflags-y += -DKSU_COMPAT_HAS_INIT_SEC_ANON
          endif
          ifeq ($(shell grep -q "CONFIG_KDP_CRED" $(srctree)/kernel/cred.c; echo $$?),0)
          ccflags-y += -DSAMSUNG_UH_DRIVER_EXIST
          endif
          ifeq ($(shell grep -q "SEC_SELINUX_PORTING_COMMON" $(srctree)/security/selinux/avc.c; echo $$?),0)
          ccflags-y += -DSAMSUNG_SELINUX_PORTING
          endif
          ccflags-$(CONFIG_KSU_SUSFS) += -DKSU_SUSFS
          ccflags-y += -UKSU_VERSION -DKSU_VERSION=35397 -UKSU_VERSION_TAG -DKSU_VERSION_TAG=\"v4.2.6-f9d89712@OriginSU\"
          ''')
          kbuild_anchor = '# Keep a new line here!! Because someone may append config'
          src = src.replace(kbuild_anchor, block + '\n' + kbuild_anchor, 1)
          p.write_text(src)
          PYKBUILD

          # 7. Fix base kernel Clang 24 / host-tool warnings & defconfig conflict
          python3 - <<'PYBASEFIX'
          from pathlib import Path
          import re

          ovt = Path("drivers/input/touchscreen/ovt/td4150_spi/ovt_tcm_sec_fn_test.c")
          if ovt.exists():
              s = ovt.read_text()
              s = re.sub(
                  r'snprintf\(\s*tcm_hcd->print_buf\s*,\s*sizeof\(\s*tcm_hcd->print_buf\s*\)\s*,\s*"NG"\s*\)\s*;',
                  'memcpy(tcm_hcd->print_buf, "NG", sizeof("NG"));',
                  s,
              )
              ovt.write_text(s)

          lexer = Path("scripts/dtc/dtc-lexer.l")
          s = lexer.read_text()
          s = re.sub(r"(?m)^[ \t]*static int dts_version = 1;[ \t]*$", "", s, count=1)
          s = re.sub(r"(?m)^[ \t]*dts_version = 1;[ \t]*$", "", s, count=1)
          lexer.write_text(s)

          sortext = Path("scripts/sortextable.c")
          s = sortext.read_text()
          for name, typ in (("w8", "uint64_t"), ("w2", "uint16_t")):
              s = re.sub(
                  rf"(?m)^([ \t]*static void \(\*{re.escape(name)}\)\({typ}, {typ} \*\))[ \t]*;$",
                  r"\1 __attribute__((unused));",
                  s,
                  count=1,
              )
          sortext.write_text(s)

          defcfg = Path("arch/arm64/configs/exynos850-a13nsxx_defconfig")
          lines = [ln for ln in defcfg.read_text().splitlines(keepends=True) if ln.rstrip("\r\n") != "CONFIG_INIT_STACK_NONE=y"]
          defcfg.write_text("".join(lines))

          kcfg_gki = Path("init/Kconfig.gki")
          s = kcfg_gki.read_text()
          for sym in ("DRM_GEM_CMA_HELPER", "DRM_MIPI_DSI"):
              s = re.sub(rf"(?m)^([ \t]*select {sym})[ \t]*$", r"\1 if (HAS_IOMEM && DRM)", s, count=1)
          kcfg_gki.write_text(s)
          print("Applied base kernel Clang 24 and Kconfig fixes")
          PYBASEFIX

      - name: D2 & E. Apply Exynos 850 Tweaks (130MHz-2210MHz, Governors, LZ4 ZRAM, GSI MTP) + OriginSU v4.2.6 (35397) + SUSFS v2.3.0
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.originsu.manager' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x51c' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || 'd91ed440459ff575f9bbdb0b294f8d679b1591a37538aafcf1d0073da5dbe968' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          python3 - <<'PYRUNTIME'
          import os
          import re
          from pathlib import Path

          ws = Path(os.environ["GITHUB_WORKSPACE"])
          diag = Path(os.environ["DIAG_DIR"])
          ksu_dir = ws / "KernelSU-Next" / "kernel"
          report = []

          def log(msg):
              print(msg)
              report.append(msg)

          def replace_c_function(src: str, fn_regex: str, new_fn: str) -> str:
              m = re.search(fn_regex, src, re.M | re.S)
              assert m, f"Function pattern {fn_regex} not found"
              brace_start = src.find("{", m.start())
              assert brace_start != -1, f"Opening brace for {fn_regex} not found"
              depth = 0
              end_idx = -1
              for idx in range(brace_start, len(src)):
                  ch = src[idx]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end_idx = idx
                          break
              assert end_idx != -1, f"Closing brace for {fn_regex} not found"
              return src[:m.start()] + new_fn + src[end_idx + 1:]

          # -------------------------------------------------------------------
          # 1. Neutralize exynos_protect_kernel_text in drivers/soc/samsung/exynos-el3_mon.c
          # -------------------------------------------------------------------
          el3_c = ws / "drivers" / "soc" / "samsung" / "exynos-el3_mon.c"
          if el3_c.exists():
              txt = el3_c.read_text(encoding="utf-8")
              new_el3_fn = "\n".join([
                  "static int __init exynos_protect_kernel_text(void)",
                  "{",
                  '\tpr_info("exynos_protect_kernel_text: bypassed for KernelSU-Next runtime patching\\n");',
                  "\treturn 0;",
                  "}",
              ])
              txt = replace_c_function(
                  txt,
                  r"static\s+int\s+(?:__init\s+)?exynos_protect_kernel_text\s*\(\s*void\s*\)\s*\{",
                  new_el3_fn,
              )
              el3_c.write_text(txt, encoding="utf-8")
              log("[Fix #1] Neutralized exynos_protect_kernel_text() in drivers/soc/samsung/exynos-el3_mon.c")

          # -------------------------------------------------------------------
          # 2. Fix 1GB PUD & 2MB PMD block-descriptor translation in patch_memory.c
          #    AND replace copy_to_kernel_nofault with memcpy in ksu_patch_text_cb
          #    (plus fix mm/maccess.c copy_to_kernel_nofault for kernel pointers)
          # -------------------------------------------------------------------
          pm_c = ksu_dir / "hook" / "arm64" / "patch_memory.c"
          pm_txt = pm_c.read_text(encoding="utf-8")
          new_phys_from_virt = "\n".join([
              "#ifndef PTE_ADDR_LOW",
              "#define PTE_ADDR_LOW (((1UL << (48 - PAGE_SHIFT)) - 1) << PAGE_SHIFT)",
              "#endif",
              "",
              "unsigned long phys_from_virt(unsigned long addr, int *err)",
              "{",
              "\tstruct mm_struct *mm = &init_mm;",
              "\tpgd_t *pgd;",
              "\tp4d_t *p4d;",
              "\tpud_t *pud;",
              "\tpmd_t *pmd;",
              "\tpte_t *pte;",
              "",
              "\t*err = 0;",
              "\tpgd = pgd_offset(mm, addr);",
              "\tif (pgd_none(*pgd) || pgd_bad(*pgd))",
              "\t\tgoto fail;",
              "",
              "\tp4d = p4d_offset(pgd, addr);",
              "\tif (p4d_none(*p4d) || p4d_bad(*p4d))",
              "\t\tgoto fail;",
              "",
              "\tpud = pud_offset(p4d, addr);",
              "\tif (pud_none(*pud))",
              "\t\tgoto fail;",
              "\tif ((pud_val(*pud) & 3UL) == 1UL) {",
              '\t\tpr_info("Address 0x%lx maps to a PUD-level huge page\\n", addr);',
              "\t\treturn (pud_val(*pud) & PTE_ADDR_LOW) + (addr & (PUD_SIZE - 1));",
              "\t}",
              "\tif (pud_bad(*pud))",
              "\t\tgoto fail;",
              "",
              "\tpmd = pmd_offset(pud, addr);",
              "\tif (pmd_none(*pmd))",
              "\t\tgoto fail;",
              "\tif ((pmd_val(*pmd) & 3UL) == 1UL) {",
              '\t\tpr_info("Address 0x%lx maps to a PMD-level huge page\\n", addr);',
              "\t\treturn (pmd_val(*pmd) & PTE_ADDR_LOW) + (addr & (PMD_SIZE - 1));",
              "\t}",
              "\tif (pmd_bad(*pmd))",
              "\t\tgoto fail;",
              "",
              "\tpte = pte_offset_kernel(pmd, addr);",
              "\tif (!pte || !pte_present(*pte))",
              "\t\tgoto fail;",
              "",
              "\treturn (pte_val(*pte) & PTE_ADDR_LOW) + (addr & (PAGE_SIZE - 1));",
              "",
              "fail:",
              "\t*err = -EFAULT;",
              "\treturn 0;",
              "}",
          ])
          pm_txt = replace_c_function(
              pm_txt,
              r"(?:static\s+)?(?:unsigned\s+long|phys_addr_t|u64|uint64_t)\s+phys_from_virt\s*\([^)]*\)\s*\{",
              new_phys_from_virt,
          )
          assert "copy_to_kernel_nofault" in pm_txt, "copy_to_kernel_nofault not found in patch_memory.c"
          pm_txt, pm_cnt = re.subn(
              r"ret\s*=\s*(?:\(\s*int\s*\)\s*)?copy_to_kernel_nofault\s*\(\s*([^,]+)\s*,\s*([^,]+)\s*,\s*([^)]+)\s*\)\s*;",
              r"memcpy(\1, \2, \3); ret = 0;",
              pm_txt,
          )
          assert pm_cnt >= 1, "Failed to replace copy_to_kernel_nofault in patch_memory.c"
          pm_c.write_text(pm_txt, encoding="utf-8")
          log("[Fix #2a] Replaced phys_from_virt() and switched ksu_patch_text_cb() from copy_to_kernel_nofault to memcpy in hook/arm64/patch_memory.c")

          maccess_c = ws / "mm" / "maccess.c"
          if maccess_c.exists():
              ma_txt = maccess_c.read_text(encoding="utf-8")
              if "copy_to_kernel_nofault" in ma_txt and "PAGE_OFFSET" not in ma_txt:
                  ma_txt, ma_cnt = re.subn(
                      r"(long\s+copy_to_kernel_nofault\s*\(\s*void\s*\*dst\s*,\s*const\s+void\s*\*src\s*,\s*size_t\s+size\s*\)\s*\{)",
                      r"\1\n\tif ((unsigned long)dst >= PAGE_OFFSET && (unsigned long)src >= PAGE_OFFSET) { memcpy(dst, src, size); return 0; }",
                      ma_txt,
                      count=1,
                  )
                  if ma_cnt:
                      maccess_c.write_text(ma_txt, encoding="utf-8")
                      log("[Fix #2b] Patched copy_to_kernel_nofault in mm/maccess.c to use memcpy for kernel-space addresses")

          # -------------------------------------------------------------------
          # 3. Fix Linux 4.19 ARM64 sys_ni_syscall lookup in hook/arm64/syscall_hook.c
          #    and prevent duplicate setresuid hook registration in hook/syscall_hook_manager.c
          # -------------------------------------------------------------------
          sh_c = ksu_dir / "hook" / "arm64" / "syscall_hook.c"
          sh_txt = sh_c.read_text(encoding="utf-8")
          assert '"__arm64_sys_ni_syscall"' in sh_txt, "__arm64_sys_ni_syscall not found in hook/arm64/syscall_hook.c"
          sh_txt = sh_txt.replace(
              'ksu_resolve_symbol_for_functable_hook("__arm64_sys_ni_syscall")',
              '(ksu_resolve_symbol_for_functable_hook("__arm64_sys_ni_syscall") ?: ksu_resolve_symbol_for_functable_hook("sys_ni_syscall"))',
          )
          sh_c.write_text(sh_txt, encoding="utf-8")
          log("[Fix #3a] Added Linux 4.19 sys_ni_syscall fallback to ksu_find_ni_syscall_slots in hook/arm64/syscall_hook.c")

          shm_c = ksu_dir / "hook" / "syscall_hook_manager.c"
          shm_txt = shm_c.read_text(encoding="utf-8")
          shm_txt = re.sub(
              r"ksu_register_syscall_hook\s*\(\s*__NR_setresuid\s*,\s*ksu_hook_setresuid\s*\)\s*;",
              "/* __NR_setresuid handled directly and unconditionally in kernel/sys.c __sys_setresuid */",
              shm_txt,
          )
          anchor_shm = 'pr_info("hook_manager: sys_enter tracepoint registered\\n");'
          if anchor_shm in shm_txt:
              shm_txt = shm_txt.replace(
                  anchor_shm,
                  anchor_shm + "\n\tksu_mark_all_process();\n\tksu_mark_running_process();",
                  1,
              )
          shm_c.write_text(shm_txt, encoding="utf-8")
          log("[Fix #3b] Updated hook/syscall_hook_manager.c for Linux 4.19 tracepoint & direct __sys_setresuid coordination")

          # -------------------------------------------------------------------
          # 4. Rewrite ksu_handle_execveat_ksud in runtime/ksud_integration.c
          #    so it NEVER fires prematurely during selinux_setup (before policy load)
          #    and ALWAYS verifies ksu_file_sid != 0 at second_stage & first_zygote
          # -------------------------------------------------------------------
          ksud_c = ksu_dir / "runtime" / "ksud_integration.c"
          ksud_txt = ksud_c.read_text(encoding="utf-8")
          m_ksud_sig = re.search(r"(void|int)\s+ksu_handle_execveat_ksud\s*\([^)]*\)\s*\{", ksud_txt)
          assert m_ksud_sig, "ksu_handle_execveat_ksud definition not found in runtime/ksud_integration.c"
          ksud_ret_type = m_ksud_sig.group(1)
          ksud_ret_stmt = "return;" if ksud_ret_type == "void" else "return 0;"
          new_ksud_execve = "\n".join([
              "extern u32 ksu_file_sid;",
              "",
              f"{ksud_ret_type} ksu_handle_execveat_ksud(const char *path, struct user_arg_ptr *argv)",
              "{",
              "\tstatic bool init_second_stage_executed = false;",
              "\tstatic bool first_zygote = true;",
              "\tchar arg[32];",
              "",
              "\tif (!path)",
              f"\t\t{ksud_ret_stmt}",
              "",
              '\tif (!init_second_stage_executed && (strcmp(path, "/system/bin/init") == 0 || strcmp(path, "/init") == 0)) {',
              "\t\tbool is_second_stage = false;",
              "\t\tif (argv) {",
              "\t\t\tmemset(arg, 0, sizeof(arg));",
              '\t\t\tif (check_argv(*argv, 1, "second_stage", arg, sizeof(arg)) ||',
              '\t\t\t    check_argv(*argv, 1, "--second-stage", arg, sizeof(arg))) {',
              "\t\t\t\tis_second_stage = true;",
              "\t\t\t}",
              "\t\t}",
              "\t\tif (is_second_stage) {",
              '\t\t\tpr_info("KernelSU: %s second_stage executed\\n", path);',
              "\t\t\tksu_selinux_hide_handle_second_stage();",
              "\t\t\tapply_kernelsu_rules();",
              "\t\t\tcache_sid();",
              "\t\t\tsetup_ksu_cred();",
              "\t\t\tif (ksu_file_sid != 0)",
              "\t\t\t\tinit_second_stage_executed = true;",
              "\t\t}",
              "\t}",
              "",
              '\tif (unlikely(first_zygote && strncmp(path, "/system/bin/app_process", 23) == 0)) {',
              "\t\tif (!init_second_stage_executed || ksu_file_sid == 0) {",
              '\t\t\tpr_info("KernelSU: applying SELinux rules & ksu_cred before zygote on_post_fs_data\\n");',
              "\t\t\tksu_selinux_hide_handle_second_stage();",
              "\t\t\tapply_kernelsu_rules();",
              "\t\t\tcache_sid();",
              "\t\t\tsetup_ksu_cred();",
              "\t\t\tinit_second_stage_executed = (ksu_file_sid != 0);",
              "\t\t}",
              '\t\tpr_info("KernelSU: exec zygote (%s), /data prepared, second_stage: %d, ksu_file_sid: %u\\n", path, init_second_stage_executed, ksu_file_sid);',
              "\t\ton_post_fs_data();",
              "\t\tfirst_zygote = false;",
              "\t\tksu_stop_ksud_execve_hook();",
              "\t}",
              "",
              f"\t{ksud_ret_stmt}",
              "}",
          ])
          ksud_txt = replace_c_function(
              ksud_txt,
              r"(?:void|int)\s+ksu_handle_execveat_ksud\s*\([^)]*\)\s*\{",
              new_ksud_execve,
          )
          ksud_c.write_text(ksud_txt, encoding="utf-8")
          log(f"[Fix #4a] Replaced {ksud_ret_type} ksu_handle_execveat_ksud in runtime/ksud_integration.c (post-policy second_stage & unconditional zygote SELinux init)")

          exec_c = ws / "fs" / "exec.c"
          ex_txt = exec_c.read_text(encoding="utf-8")
          if "ksu_handle_execveat_ksud" not in ex_txt:
              ex_decl = "\n".join([
                  "",
                  "#ifdef CONFIG_KSU",
                  f"extern {ksud_ret_type} ksu_handle_execveat_ksud(const char *path, struct user_arg_ptr *argv);",
                  "#endif",
                  "",
              ])
              m_fn = re.search(r"static\s+int\s+__do_execve_file\s*\([^)]*\)\s*\{", ex_txt)
              assert m_fn, "__do_execve_file not found in fs/exec.c"
              ex_txt = ex_txt[:m_fn.start()] + ex_decl + ex_txt[m_fn.start():]
              m_fn = re.search(r"static\s+int\s+__do_execve_file\s*\([^)]*\)\s*\{", ex_txt)
              m_err = re.search(
                  r"if\s*\(\s*IS_ERR\(\s*filename\s*\)\s*\)\s*return\s+PTR_ERR\(\s*filename\s*\)\s*;",
                  ex_txt[m_fn.end():],
              )
              assert m_err, "IS_ERR(filename) check not found in fs/exec.c"
              pos = m_fn.end() + m_err.end()
              ex_hook = "\n".join([
                  "",
                  "#ifdef CONFIG_KSU",
                  "\tif (filename && !IS_ERR(filename) && filename->name)",
                  "\t\tksu_handle_execveat_ksud(filename->name, &argv);",
                  "#endif",
              ])
              ex_txt = ex_txt[:pos] + ex_hook + ex_txt[pos:]
              exec_c.write_text(ex_txt, encoding="utf-8")
              log("[Fix #4b] Wired direct ksu_handle_execveat_ksud call in fs/exec.c __do_execve_file")

          # -------------------------------------------------------------------
          # 5. Attach init FBE session_keyring to ksu_cred in selinux/selinux.c
          #    and call track_throne(false) in runtime/boot_event.c on_post_fs_data()
          # -------------------------------------------------------------------
          sel_c = ksu_dir / "selinux" / "selinux.c"
          sel_txt = sel_c.read_text(encoding="utf-8")
          if "install_session_keyring_to_cred" not in sel_txt:
              sel_hdr = "\n".join([
                  "#include <linux/key.h>",
                  "#include <linux/cred.h>",
                  "#ifdef CONFIG_KEYS",
                  "extern int install_session_keyring_to_cred(struct cred *cred, struct key *keyring);",
                  "#endif",
                  "",
              ])
              sel_txt = sel_hdr + sel_txt
          new_setup_ksu_cred = "\n".join([
              "void setup_ksu_cred(void)",
              "{",
              "\tif (!ksu_cred) {",
              "\t\tksu_cred = prepare_creds();",
              "\t}",
              "\tif (ksu_cred && transive_to_domain(KERNEL_SU_CONTEXT, ksu_cred, false)) {",
              '\t\tpr_err("setup ksu cred failed.\\n");',
              "\t}",
              "#ifdef CONFIG_KEYS",
              "\tif (ksu_cred && !ksu_cred->session_keyring && current->cred && current->cred->session_keyring) {",
              "\t\tinstall_session_keyring_to_cred(ksu_cred, current->cred->session_keyring);",
              '\t\tpr_info("KernelSU: attached init FBE session_keyring to ksu_cred\\n");',
              "\t}",
              "#endif",
              "}",
          ])
          sel_txt = replace_c_function(
              sel_txt,
              r"void\s+setup_ksu_cred\s*\(\s*void\s*\)\s*\{",
              new_setup_ksu_cred,
          )
          sel_c.write_text(sel_txt, encoding="utf-8")
          log("[Fix #5a] Updated setup_ksu_cred() in selinux/selinux.c to re-apply ksu_sid and attach init FBE session_keyring")

          boot_c = ksu_dir / "runtime" / "boot_event.c"
          boot_txt = boot_c.read_text(encoding="utf-8")
          if '#include "selinux/selinux.h"' not in boot_txt:
              boot_txt = '#include "selinux/selinux.h"\nextern u32 ksu_file_sid;\n' + boot_txt
          boot_txt, boot_cnt = re.subn(
              r"ksu_observer_init\s*\(\s*\)\s*;",
              "if (ksu_file_sid == 0) { apply_kernelsu_rules(); cache_sid(); }\n\tsetup_ksu_cred();\n\tksu_observer_init();\n\ttrack_throne(false);",
              boot_txt,
              count=1,
          )
          assert boot_cnt == 1, "ksu_observer_init() not found in runtime/boot_event.c"
          boot_c.write_text(boot_txt, encoding="utf-8")
          log("[Fix #5b] Added setup_ksu_cred() + track_throne(false) in runtime/boot_event.c on_post_fs_data()")

          # -------------------------------------------------------------------
          # 6. Pure OriginSU v4.2.6 (35397, com.originsu.manager, 0x51c) Support:
          #    - 32-bit (armeabi-v7a) and 64-bit (arm64-v8a) dual support
          # -------------------------------------------------------------------
          apk_c = ksu_dir / "manager" / "apk_sign.c"
          apk_txt = apk_c.read_text(encoding="utf-8")
          m_apk = re.search(r"bool\s+is_manager_apk\s*\(\s*char\s*\*path\s*\)\s*\{", apk_txt)
          assert m_apk, "is_manager_apk(char *path) not found in manager/apk_sign.c"
          apk_fastpath = "\n".join([
              "",
              '\tif (path && (strstr(path, "/com.originsu.manager-") || strstr(path, "/com.originsu.manager/"))) {',
              '\t\tpr_info("OriginSU: matched manager package path %s\\n", path);',
              "\t\treturn true;",
              "\t}",
          ])
          apk_txt = apk_txt[:m_apk.end()] + apk_fastpath + apk_txt[m_apk.end():]
          apk_c.write_text(apk_txt, encoding="utf-8")
          log("[Fix #6a] Injected OriginSU v4.2.6 (com.originsu.manager) package-path fast-path in manager/apk_sign.c")

          tt_c = ksu_dir / "manager" / "throne_tracker.c"
          tt_txt = tt_c.read_text(encoding="utf-8")
          m_crown = re.search(r'pr_info\("Crowning manager:[^;]+;\s*([a-zA-Z0-9_]+)\s*\(', tt_txt)
          crown_fn = m_crown.group(1) if m_crown else "ksu_set_manager_appid"
          tt_anchor = 'pr_info("Search manager finished\\n");'
          assert tt_anchor in tt_txt, "Search manager finished anchor not found in throne_tracker.c"
          tt_fallback = "\n".join([
              tt_anchor,
              "\t{",
              "\t\tstruct uid_data *np;",
              "\t\tlist_for_each_entry(np, &uid_list, list) {",
              '\t\t\tif (strcmp(np->package, "com.originsu.manager") == 0) {',
              '\t\t\t\tpr_info("OriginSU: crowning %s (uid=%d) directly from packages.list\\n", np->package, np->uid);',
              f"\t\t\t\t{crown_fn}(np->uid);",
              "\t\t\t}",
              "\t\t}",
              "\t}",
          ])
          tt_txt = tt_txt.replace(tt_anchor, tt_fallback, 1)
          tt_c.write_text(tt_txt, encoding="utf-8")
          log("[Fix #6b] Added OriginSU v4.2.6 (com.originsu.manager) crowning in manager/throne_tracker.c")

          # -------------------------------------------------------------------
          # 7. Fix Linux 4.19 seccomp bypass & on-demand throne scan in
          #    policy/app_profile.c, policy/app_profile.h, hook/setuid_hook.c
          # -------------------------------------------------------------------
          app_c = ksu_dir / "policy" / "app_profile.c"
          app_h = ksu_dir / "policy" / "app_profile.h"
          setuid_c = ksu_dir / "hook" / "setuid_hook.c"

          app_src = app_c.read_text(encoding="utf-8")
          m_app = re.search(r"\bint\s+escape_with_root_profile\s*\(\s*void\s*\)", app_src)
          assert m_app, "escape_with_root_profile not found in policy/app_profile.c"
          helper = "\n".join([
              "",
              "#include <linux/sched/signal.h>",
              "/* DARKNIGHT_MANAGER_SECCOMP_FD_FIX */",
              "void ksu_disable_seccomp_for_manager(void)",
              "{",
              "    struct task_struct *t;",
              "",
              "    if (current->seccomp.mode != 0 || current->seccomp.filter != NULL) {",
              "        disable_seccomp();",
              "    }",
              "    if (current->sighand) {",
              "        spin_lock_irq(&current->sighand->siglock);",
              "        for_each_thread(current, t) {",
              "            clear_tsk_thread_flag(t, TIF_SECCOMP);",
              "            t->seccomp.mode = 0;",
              "        }",
              "        spin_unlock_irq(&current->sighand->siglock);",
              "    } else {",
              "        clear_tsk_thread_flag(current, TIF_SECCOMP);",
              "        current->seccomp.mode = 0;",
              "    }",
              "}",
              "",
          ])
          app_c.write_text(app_src[:m_app.start()] + helper + app_src[m_app.start():], encoding="utf-8")

          h_src = app_h.read_text(encoding="utf-8")
          m_h = re.search(r"\bint\s+escape_with_root_profile\s*\(\s*void\s*\)\s*;", h_src)
          assert m_h, "escape_with_root_profile declaration not found in policy/app_profile.h"
          app_h.write_text(
              h_src[:m_h.start()] + "void ksu_disable_seccomp_for_manager(void);\n\n" + h_src[m_h.start():],
              encoding="utf-8",
          )

          su_src = setuid_c.read_text(encoding="utf-8")
          for inc in ('#include "policy/app_profile.h"', '#include "manager/throne_tracker.h"', '#include "selinux/selinux.h"'):
              if inc not in su_src:
                  su_src = su_src.replace('#include "policy/allowlist.h"', '#include "policy/allowlist.h"\n' + inc, 1)
          new_setresuid_fn = "\n".join([
              "extern u32 ksu_file_sid;",
              "extern void ksu_ensure_driver_fd_installed(void);",
              "",
              "int ksu_handle_setresuid(uid_t old_uid, uid_t new_uid)",
              "{",
              "    if (old_uid != 0)",
              "        return 0;",
              "",
              '    pr_info("handle_setresuid from %d to %d\\n", old_uid, new_uid);',
              "",
              "    if (unlikely(new_uid >= 10000 && ksu_file_sid == 0)) {",
              "        apply_kernelsu_rules();",
              "        cache_sid();",
              "        setup_ksu_cred();",
              "    }",
              "",
              "    if (unlikely(new_uid >= 10000 && !is_uid_manager(new_uid))) {",
              "        static int ksu_throne_retries = 128;",
              "        if (ksu_throne_retries > 0) {",
              "            ksu_throne_retries--;",
              "            track_throne(false);",
              "        }",
              '        if (!is_uid_manager(new_uid) && (strstr(current->comm, "originsu") || strstr(current->comm, "riginsu"))) {',
              "            ksu_set_manager_appid(new_uid % 100000);",
              "        }",
              "    }",
              "",
              "    if (unlikely(is_uid_manager(new_uid))) {",
              "        ksu_disable_seccomp_for_manager();",
              "        ksu_set_task_tracepoint_flag(current);",
              '        pr_info("KernelSU: seccomp disabled & installing fd for manager uid=%d\\n", new_uid);',
              "        ksu_ensure_driver_fd_installed();",
              "        return 0;",
              "    }",
              "",
              "    if (ksu_is_allow_uid_for_current(new_uid)) {",
              "        ksu_disable_seccomp_for_manager();",
              "        ksu_set_task_tracepoint_flag(current);",
              "    } else {",
              "        ksu_clear_task_tracepoint_flag_if_needed(current);",
              "    }",
              "",
              "    ksu_handle_umount(old_uid, new_uid);",
              "    return 0;",
              "}",
          ])
          su_src = replace_c_function(
              su_src,
              r"int\s+ksu_handle_setresuid\s*\([^)]*\)\s*\{",
              new_setresuid_fn,
          )
          setuid_c.write_text(su_src, encoding="utf-8")
          log("[Fix #7] Patched setuid_hook.c with old_uid==0 guard, on-demand track_throne(false), and Linux 4.19 seccomp bypass")

          # -------------------------------------------------------------------
          # 8. Integrate SUSFS v2.3.0 NON-GKI (fs/susfs.c + include/linux/susfs.h + VFS/procfs hooks)
          #    supporting both 0xfafafafa (SUSFS v2.3.0 with err writeback) and 0xdeadbeef (v1.5.5)
          # -------------------------------------------------------------------
          susfs_h = ws / "include" / "linux" / "susfs.h"
          susfs_def_h = ws / "include" / "linux" / "susfs_def.h"
          susfs_c = ws / "fs" / "susfs.c"

          susfs_h.write_text("\n".join([
              "#ifndef _LINUX_SUSFS_H",
              "#define _LINUX_SUSFS_H",
              "",
              "#include <linux/types.h>",
              "#include <linux/utsname.h>",
              "#include <linux/path.h>",
              "#include <linux/fs.h>",
              "#include <linux/stat.h>",
              "#include <linux/seq_file.h>",
