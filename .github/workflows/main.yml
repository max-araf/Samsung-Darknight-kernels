              fs_mk.write_text(mk_txt, encoding="utf-8")

          # Wire SUSFS v2.3.0 VFS hooks into fs/stat.c, fs/readdir.c, fs/proc/cmdline.c, fs/proc/task_mmu.c, kernel/kallsyms.c
          stat_c = ws / "fs" / "stat.c"
          if stat_c.exists():
              st_txt = stat_c.read_text(encoding="utf-8")
              if "susfs_sus_kstat_spoof_generic_fillattr" not in st_txt:
                  st_txt = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n" + st_txt
                  st_txt, st_cnt = re.subn(
                      r"(void\s+generic_fillattr\s*\(\s*struct\s+inode\s*\*inode\s*,\s*struct\s+kstat\s*\*stat\s*\)\s*\{.*?)(^\})",
                      r"\1#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n\tif (unlikely(current_uid().val >= 10000 && susfs_is_inode_sus_kstat(inode)))\n\t\tsusfs_sus_kstat_spoof_generic_fillattr(inode, stat);\n#endif\n\2",
                      st_txt,
                      count=1,
                      flags=re.S | re.M,
                  )
                  if st_cnt:
                      stat_c.write_text(st_txt, encoding="utf-8")
                      log("[SUSFS v2.3.0] Hooked generic_fillattr in fs/stat.c for sus_kstat spoofing")

          readdir_c = ws / "fs" / "readdir.c"
          if readdir_c.exists():
              rd_txt = readdir_c.read_text(encoding="utf-8")
              if "susfs_is_sus_path_ino" not in rd_txt:
                  rd_txt = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n" + rd_txt
                  for fn_name in ("filldir", "filldir64"):
                      m_fd = re.search(rf"static\s+int\s+{fn_name}\s*\([^)]*\)\s*\{{", rd_txt)
                      if m_fd:
                          m_if = re.search(r"\bif\s*\(", rd_txt[m_fd.end():])
                          if m_if:
                              pos = m_fd.end() + m_if.start()
                              rd_hook = (
                                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                                  "\tif (unlikely(current_uid().val >= 10000 && susfs_is_sus_path_ino(ino)))\n"
                                  "\t\treturn 0;\n"
                                  "#endif\n\t"
                              )
                              rd_txt = rd_txt[:pos] + rd_hook + rd_txt[pos:]
                  readdir_c.write_text(rd_txt, encoding="utf-8")
                  log("[SUSFS v2.3.0] Hooked filldir and filldir64 in fs/readdir.c for sus_path hiding")

          cmdline_c = ws / "fs" / "proc" / "cmdline.c"
          if cmdline_c.exists():
