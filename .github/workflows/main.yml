              "    }",
              "    if (cmd == CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG || cmd == CMD_SUSFS_SET_CMDLINE_V1) {",
              "        error = susfs_set_cmdline_or_bootconfig((char __user *)arg);",
