              "        error = susfs_show_variant((char __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    return -EINVAL;",
              "out_copy:",
              "    if (err_out) {",
              "        if (copy_to_user(err_out, &error, sizeof(error)))",
              "            return -EFAULT;",
              "    }",
              "    return 0;",
              "#else",
              "    return -ENOSYS;",
              "#endif",
              "}",
              "",
              "extern u32 ksu_file_sid;",
              "",
              "static bool ksu_has_driver_fd(void)",
              "{",
              "    struct files_struct *files = current->files;",
              "    struct fdtable *fdt;",
              "    unsigned int i;",
              "    bool found = false;",
              "",
              "    if (!files)",
              "        return false;",
              "    rcu_read_lock();",
              "    fdt = files_fdtable(files);",
              "    if (fdt && fdt->fd) {",
              "        unsigned int max_fds = fdt->max_fds;",
              "        if (max_fds > 1024)",
              "            max_fds = 1024;",
              "        for (i = 0; i < max_fds; i++) {",
              "            struct file *f = rcu_dereference(fdt->fd[i]);",
              "            if (f && f->f_op == &anon_ksu_fops) {",
              "                found = true;",
              "                break;",
              "            }",
              "        }",
              "    }",
              "    rcu_read_unlock();",
              "    return found;",
              "}",
              "",
              "void ksu_ensure_driver_fd_installed(void)",
              "{",
              "    if (!ksu_has_driver_fd()) {",
              "        int fd = ksu_install_fd();",
              '        pr_info("KernelSU: ensured [ksu_driver] fd=%d for pid=%d uid=%u comm=%s\\n",',
              "                fd, current->pid, current_uid().val, current->comm);",
              "    }",
              "}",
              "",
              "int ksu_handle_legacy_prctl(int option, unsigned long arg2, unsigned long arg3,",
              "                            unsigned long arg4, unsigned long arg5)",
              "{",
              "    uid_t uid = current_uid().val;",
              "",
              "    /* 1. PR_SET_NAME (15): detect com.originsu.manager process specialization immediately */",
              "    if (option == 15 && uid >= 10000 && arg2 != 0UL) {",
              "        char kname[16];",
              "        memset(kname, 0, sizeof(kname));",
              "        if (strncpy_from_user(kname, (const char __user *)arg2, sizeof(kname) - 1) > 0) {",
              '            if (strstr(kname, "originsu") || strstr(kname, "riginsu")) {',
              "                if (ksu_file_sid == 0) {",
              "                    apply_kernelsu_rules();",
              "                    cache_sid();",
              "                    setup_ksu_cred();",
              "                }",
              "                if (!is_uid_manager(uid)) {",
              '                    pr_info("KernelSU: crowning manager uid=%u from PR_SET_NAME (%s)\\n", uid, kname);',
              "                    ksu_set_manager_appid(uid % 100000);",
              "                }",
              "                ksu_disable_seccomp_for_manager();",
              "                ksu_ensure_driver_fd_installed();",
              "            }",
              "        }",
              "        return -ENOSYS;",
              "    }",
              "",
              "    /* 2. PR_GET_SECCOMP (21): ensure seccomp is disabled & fd installed when Manager queries status */",
              "    if (option == 21 && uid >= 10000) {",
              '        if (!is_uid_manager(uid) && (strstr(current->comm, "originsu") || strstr(current->comm, "riginsu"))) {',
              "            if (ksu_file_sid == 0) {",
              "                apply_kernelsu_rules();",
              "                cache_sid();",
              "                setup_ksu_cred();",
              "            }",
              "            ksu_set_manager_appid(uid % 100000);",
              "        }",
              "        if (is_uid_manager(uid)) {",
              "            ksu_disable_seccomp_for_manager();",
              "            ksu_ensure_driver_fd_installed();",
              "        }",
              "        return -ENOSYS;",
              "    }",
              "",
              "    /* 3. KernelSU-Next / SUSFS magic 0xdeadbeef */",
              "    if ((unsigned int)option != 0xdeadbeefU)",
              "        return -ENOSYS;",
              "",
              "    if (arg2 >= 0x55550UL && arg2 <= 0x60050UL) {",
              "        if (ksu_handle_susfs_command((int)option, 0, (unsigned int)arg2,",
              "                                     (void __user *)arg3, (void __user *)arg5) == 0)",
              "            return 0;",
              "        return -EINVAL;",
              "    }",
              "",
              "    if (ksu_file_sid == 0) {",
              "        apply_kernelsu_rules();",
              "        cache_sid();",
              "        setup_ksu_cred();",
              "    }",
              "",
              "    if (!is_uid_manager(uid) && uid >= 10000) {",
              "        track_throne(false);",
              '        if (!is_uid_manager(uid) && (strstr(current->comm, "originsu") || strstr(current->comm, "riginsu"))) {',
              '            pr_info("KernelSU: crowning manager uid=%u from 0xdeadbeef prctl (%s)\\n", uid, current->comm);',
              "            ksu_set_manager_appid(uid % 100000);",
              "        }",
              "    }",
              "",
              "    if (is_uid_manager(uid) || uid == 0 || ksu_is_allow_uid_for_current(uid)) {",
              "        ksu_disable_seccomp_for_manager();",
              "        ksu_ensure_driver_fd_installed();",
              "        if (arg2 == 2UL) {",
              "            u32 ver = KSU_VERSION;",
              "            u32 flags = 0;",
              "            u32 reply = 0xdeadbeefU;",
              "            if (arg3)",
              "                (void)copy_to_user((void __user *)arg3, &ver, sizeof(ver));",
              "            if (arg4)",
              "                (void)copy_to_user((void __user *)arg4, &flags, sizeof(flags));",
              "            if (arg5)",
              "                (void)copy_to_user((void __user *)arg5, &reply, sizeof(reply));",
              "            return 0;",
              "        }",
              "    }",
              "",
              "    return -ENOSYS;",
              "}",
              "",
              "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg)",
              "{",
              "    struct pt_regs real_regs;",
              "    struct pt_regs outer_regs;",
              "",
              "    if ((unsigned int)magic1 != KSU_INSTALL_MAGIC1)",
              "        return 0;",
              "",
              "    if ((unsigned int)magic2 == 0xfafafafaU || (cmd >= 0x55550U && cmd <= 0x60050U)) {",
              "        ksu_handle_susfs_command(magic1, magic2, cmd, arg ? *arg : NULL, NULL);",
              "        return 0;",
              "    }",
              "",
              "    if (ksu_file_sid == 0) {",
              "        apply_kernelsu_rules();",
              "        cache_sid();",
              "        setup_ksu_cred();",
              "    }",
              "",
              "    if ((unsigned int)magic2 == KSU_INSTALL_MAGIC2 || (unsigned int)magic2 == 0xdead2022U || (unsigned int)magic2 == 6969U) {\n        magic2 = (int)KSU_INSTALL_MAGIC2;",
              "        if (unlikely(!is_uid_manager(current_uid().val) && current_uid().val >= 10000)) {",
              "            track_throne(false);",
              '            if (!is_uid_manager(current_uid().val) && (strstr(current->comm, "originsu") || strstr(current->comm, "riginsu"))) {',
              "                ksu_set_manager_appid(current_uid().val % 100000);",
              "            }",
              "        }",
              "        if (is_uid_manager(current_uid().val) || current_uid().val == 0) {",
              "            ksu_disable_seccomp_for_manager();",
              "            ksu_ensure_driver_fd_installed();",
              "        }",
              "    }",
              "",
              "    memset(&real_regs, 0, sizeof(real_regs));",
              "    memset(&outer_regs, 0, sizeof(outer_regs));",
              "    real_regs.regs[0] = (unsigned long)(unsigned int)magic1;",
              "    real_regs.regs[1] = (unsigned long)(unsigned int)magic2;",
              "    real_regs.regs[2] = (unsigned long)cmd;",
              "    real_regs.regs[3] = arg ? (unsigned long)(*arg) : 0UL;",
              "    PT_REGS_PARM1(&outer_regs) = (unsigned long)&real_regs;",
              "",
              "    return reboot_handler_pre(NULL, &outer_regs);",
              "}",
              "",
