              "    char pathname[SUSFS_MAX_LEN_PATHNAME];",
              "    unsigned long dev;",
              "    struct list_head list;",
              "};",
              "",
              "struct susfs_kstat_Node {",
              "    struct st_susfs_sus_kstat info;",
              "    struct list_head list;",
              "};",
              "",
              "struct susfs_try_umount_Node {",
              "    struct st_susfs_try_umount info;",
              "    struct list_head list;",
              "};",
              "",
              "static LIST_HEAD(sus_path_list);",
              "static LIST_HEAD(sus_map_list);",
              "static LIST_HEAD(sus_mount_list);",
              "static LIST_HEAD(sus_kstat_list);",
              "static LIST_HEAD(try_umount_list);",
              "static DEFINE_SPINLOCK(susfs_spin_lock);",
              "",
              "static struct st_susfs_uname spoofed_uname;",
              "static bool has_spoofed_uname = false;",
              "static char *spoofed_cmdline = NULL;",
              "static bool susfs_log_enabled = true;",
              "static bool hide_sus_mnts_for_non_su = true;",
              "static bool avc_log_spoofing_enabled = false;",
              "",
              "bool susfs_is_sus_path_ino(unsigned long ino)",
              "{",
              "    struct susfs_path_Node *node;",
              "    bool found = false;",
              "    if (!ino)",
              "        return false;",
              "    spin_lock(&susfs_spin_lock);",
              "    list_for_each_entry(node, &sus_path_list, list) {",
              "        if (node->ino == ino) {",
              "            found = true;",
              "            break;",
              "        }",
              "    }",
              "    spin_unlock(&susfs_spin_lock);",
