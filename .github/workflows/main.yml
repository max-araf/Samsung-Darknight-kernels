              "int susfs_set_avc_log_spoofing(void __user *user_info);",
              "int susfs_set_cmdline_or_bootconfig(char __user *user_info);",
              "int susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);",
              "int susfs_add_open_redirect(struct st_susfs_open_redirect __user *user_info);",
              "int susfs_show_version(char __user *user_info);",
              "int susfs_show_enabled_features(char __user *user_info, size_t len);",
              "int susfs_get_enabled_features(char __user *user_info);",
              "int susfs_show_variant(char __user *user_info);",
              "bool susfs_is_sus_path_ino(unsigned long ino);",
              "bool susfs_is_inode_sus_path(struct inode *inode);",
              "bool susfs_is_sus_maps_ino(unsigned long ino);",
              "void __init susfs_init(void);",
              "",
              "#endif /* _LINUX_SUSFS_H */",
              "",
          ]), encoding="utf-8")

          susfs_def_h.write_text(
              "#ifndef _LINUX_SUSFS_DEF_H\n#define _LINUX_SUSFS_DEF_H\n#include <linux/susfs.h>\n#endif\n",
              encoding="utf-8",
          )

          susfs_c.write_text("\n".join([
              "// SPDX-License-Identifier: GPL-2.0",
              "#include <linux/module.h>",
              "#include <linux/kernel.h>",
              "#include <linux/fs.h>",
              "#include <linux/slab.h>",
              "#include <linux/uaccess.h>",
              "#include <linux/spinlock.h>",
              "#include <linux/list.h>",
              "#include <linux/namei.h>",
              "#include <linux/utsname.h>",
              "#include <linux/seq_file.h>",
