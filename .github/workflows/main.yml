              rb_txt = rb_txt[:pos] + rb_hook + rb_txt[pos:]
              reboot_c.write_text(rb_txt, encoding="utf-8")
              log("[Fix #8b] Wired direct ksu_handle_sys_reboot call into kernel/reboot.c SYSCALL_DEFINE4(reboot)")

          # Patch kernel/sys.c (__sys_setresuid UNCONDITIONALLY, SYSCALL_DEFINE1(newuname), SYSCALL_DEFINE5(prctl))
          sys_c = ws / "kernel" / "sys.c"
          sys_txt = sys_c.read_text(encoding="utf-8")
          if "ksu_handle_setresuid" not in sys_txt:
              sys_decl = "\n".join([
                  "",
                  "#ifdef CONFIG_KSU",
                  "#include <linux/thread_info.h>",
                  "extern int ksu_handle_setresuid(uid_t old_uid, uid_t new_uid);",
                  "extern int ksu_handle_susfs_command(int magic1, int magic2, unsigned int cmd, void __user *arg, void __user *err_out);",
                  "extern int ksu_handle_legacy_prctl(int option, unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5);",
                  "#endif",
                  "#ifdef CONFIG_KSU_SUSFS",
                  "#include <linux/susfs.h>",
                  "#endif",
                  "",
              ])
              m_sr = re.search(r"long\s+__sys_setresuid\s*\(\s*uid_t\s+ruid\s*,\s*uid_t\s+euid\s*,\s*uid_t\s+suid\s*\)\s*\{", sys_txt)
              assert m_sr, "__sys_setresuid not found in kernel/sys.c"
              sys_txt = sys_txt[:m_sr.start()] + sys_decl + sys_txt[m_sr.start():]
              m_sr = re.search(r"long\s+__sys_setresuid\s*\(\s*uid_t\s+ruid\s*,\s*uid_t\s+euid\s*,\s*uid_t\s+suid\s*\)\s*\{", sys_txt)
              next_fn = sys_txt.find("SYSCALL_DEFINE3(setresuid", m_sr.end())
              assert next_fn != -1, "SYSCALL_DEFINE3(setresuid) not found after __sys_setresuid"
              fn_body = sys_txt[m_sr.end():next_fn]
              m_cc = re.search(r"(return\s+commit_creds\s*\(\s*new\s*\)\s*;|retval\s*=\s*commit_creds\s*\(\s*new\s*\)\s*;)", fn_body)
              assert m_cc, "commit_creds(new) not found in __sys_setresuid"
              if m_cc.group(1).strip().startswith("return"):
                  cc_repl = "\n".join([
                      "{",
                      "\t\tuid_t ksu_old_uid = current_uid().val;",
                      "\t\tint ksu_ret = commit_creds(new);",
                      "#ifdef CONFIG_KSU",
                      "\t\tif (ksu_ret >= 0)",
                      "\t\t\tksu_handle_setresuid(ksu_old_uid, current_uid().val);",
                      "#endif",
                      "\t\treturn ksu_ret;",
                      "\t}",
                  ])
              else:
                  cc_repl = "\n".join([
                      "{",
                      "\t\tuid_t ksu_old_uid = current_uid().val;",
                      "\t\tretval = commit_creds(new);",
                      "#ifdef CONFIG_KSU",
                      "\t\tif (retval >= 0)",
                      "\t\t\tksu_handle_setresuid(ksu_old_uid, current_uid().val);",
                      "#endif",
                      "\t}",
                  ])
              fn_body = fn_body[:m_cc.start()] + cc_repl + fn_body[m_cc.end():]
              sys_txt = sys_txt[:m_sr.end()] + fn_body + sys_txt[next_fn:]

              # Hook SYSCALL_DEFINE1(newuname) for SUSFS uname spoofing
              sys_txt = re.sub(
                  r"(memcpy\s*\(\s*&tmp\s*,\s*&?utsname\s*\(\s*\)(?:\s*->\s*sysname)?\s*,\s*sizeof\s*\(\s*tmp\s*\)\s*\)\s*;)",
                  r"\1\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif",
                  sys_txt,
                  count=1,
              )

              # Hook SYSCALL_DEFINE5(prctl) for SUSFS userspace commands
              m_pr = re.search(r"SYSCALL_DEFINE5\s*\(\s*prctl\s*,[^{]+\{", sys_txt)
              assert m_pr, "SYSCALL_DEFINE5(prctl) not found in kernel/sys.c"
              m_sec = re.search(r"error\s*=\s*security_task_prctl\s*\([^;]+;", sys_txt[m_pr.end():])
              assert m_sec, "security_task_prctl call not found in SYSCALL_DEFINE5(prctl)"
              idx_pr = m_pr.end() + m_sec.start()
              pr_hook = "\n".join([
                  "#ifdef CONFIG_KSU",
                  "\tif (ksu_handle_legacy_prctl(option, arg2, arg3, arg4, arg5) == 0)",
                  "\t\treturn 0;",
                  "#endif",
                  "\t",
              ])
              sys_txt = sys_txt[:idx_pr] + pr_hook + sys_txt[idx_pr:]
              sys_c.write_text(sys_txt, encoding="utf-8")
              log("[Fix #8c] Wired unconditional __sys_setresuid, newuname, and prctl hooks in kernel/sys.c")


          # -------------------------------------------------------------------
          # 9. Exynos 850 Kernel Tweaks (CPU 130MHz-2210MHz OC/UC, ZRAM LZ4 Default,
          #    MTP for GSIs/AOSP/Stock/Port ROMs, and 32-bit/64-bit Dual-ABI Support)
          # -------------------------------------------------------------------
          for dts in (ws / "arch" / "arm64" / "boot" / "dts" / "exynos").glob("exynos3830*.dts*"):
              dtxt = dts.read_text(encoding="utf-8", errors="ignore")
              dnew = re.sub(r"(max-freq\s*=\s*<)\d+(>;)", r"\g<1>2210000\2", dtxt)
              dnew = re.sub(r"(min-freq\s*=\s*<)\d+(>;)", r"\g<1>130000\2", dnew)
              if dnew != dtxt:
                  dts.write_text(dnew, encoding="utf-8")
                  log(f"[Tweaks] Updated CPU frequency range (130MHz - 2210MHz) in {dts.name}")

          acme_c = ws / "drivers" / "cpufreq" / "exynos-acme.c"
          if acme_c.exists():
              atxt = acme_c.read_text(encoding="utf-8")
              atxt = re.sub(
                  r"(domain->max_freq\s*=\s*min\s*\([^;]+;)",
                  r"\1\n\tdomain->max_freq = 2210000;\n\tdomain->min_freq = 130000;",
                  atxt,
                  count=1,
              )
              acme_c.write_text(atxt, encoding="utf-8")
              log("[Tweaks] Unlocked 130MHz underclock & 2210MHz overclock in drivers/cpufreq/exynos-acme.c")

          vclk_c = ws / "drivers" / "soc" / "samsung" / "cal-if" / "vclk.c"
          if vclk_c.exists():
              vtxt = vclk_c.read_text(encoding="utf-8")
              vtxt = re.sub(
                  r"(unsigned\s+long\s+cal_dfs_get_max_freq\s*\(\s*unsigned\s+int\s+id\s*\)\s*\{)",
                  r"\1\n\tif (id == 0 || id == 1 || (id & 0xffff) <= 2) return 2210000UL;",
                  vtxt,
                  count=1,
              )
              vtxt = re.sub(
                  r"(unsigned\s+long\s+cal_dfs_get_min_freq\s*\(\s*unsigned\s+int\s+id\s*\)\s*\{)",
                  r"\1\n\tif (id == 0 || id == 1 || (id & 0xffff) <= 2) return 130000UL;",
                  vtxt,
                  count=1,
              )
              vclk_c.write_text(vtxt, encoding="utf-8")
              log("[Tweaks] Unlocked cal_dfs_get_max_freq (2210MHz) & cal_dfs_get_min_freq (130MHz) in drivers/soc/samsung/cal-if/vclk.c")

          zram_c = ws / "drivers" / "block" / "zram" / "zram_drv.c"
          if zram_c.exists():
              ztxt = zram_c.read_text(encoding="utf-8")
              ztxt = re.sub(
                  r'default_compressor\s*=\s*"[^"]+"',
                  'default_compressor = "lz4"',
                  ztxt,
              )
              zram_c.write_text(ztxt, encoding="utf-8")
              log("[Tweaks] Set default_compressor = \"lz4\" in drivers/block/zram/zram_drv.c")

          fmtp_c = ws / "drivers" / "usb" / "gadget" / "function" / "f_mtp.c"
          if fmtp_c.exists():
              mtxt = fmtp_c.read_text(encoding="utf-8")
              if "DECLARE_USB_FUNCTION_INIT(mtp," not in mtxt and "alloc_inst_mtp_ptp" in mtxt:
                  mtxt += "\n#ifdef CONFIG_USB_CONFIGFS_F_MTP\nDECLARE_USB_FUNCTION_INIT(mtp, alloc_inst_mtp_ptp, function_alloc_mtp_ptp);\n#endif\n"
                  fmtp_c.write_text(mtxt, encoding="utf-8")
                  log("[Tweaks] Added MTP for GSIs + Stock OneUI dual USB function registration in drivers/usb/gadget/function/f_mtp.c")

          # 32-bit (compat) + 64-bit dual-ABI VFS sucompat hooks in fs/open.c and fs/stat.c
          open_c = ws / "fs" / "open.c"
          if open_c.exists():
              otxt = open_c.read_text(encoding="utf-8")
              if "ksu_handle_faccessat" not in otxt:
                  odecl = "\n#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n"
                  m_fa = re.search(r"long\s+do_faccessat\s*\(\s*int\s+dfd\s*,\s*const\s+char\s+__user\s*\*filename\s*,\s*int\s+mode\s*\)\s*\{", otxt)
                  if m_fa:
                      otxt = otxt[:m_fa.start()] + odecl + otxt[m_fa.start():]
                      m_fa = re.search(r"long\s+do_faccessat\s*\(\s*int\s+dfd\s*,\s*const\s+char\s+__user\s*\*filename\s*,\s*int\s+mode\s*\)\s*\{", otxt)
                      m_if = re.search(r"\bif\s*\(", otxt[m_fa.end():])
                      if m_if:
                          pos = m_fa.end() + m_if.start()
                          ohook = "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\t"
                          otxt = otxt[:pos] + ohook + otxt[pos:]
                          open_c.write_text(otxt, encoding="utf-8")
                          log("[OriginSU 32/64-bit] Wired ksu_handle_faccessat into fs/open.c do_faccessat() for 32-bit & 64-bit dual-ABI root")

          (diag / "integration-summary.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
          PYRUNTIME

          git diff > "${DIAG_DIR}/patches/kernel-tree-integration.diff"
          git -C KernelSU-Next diff > "${DIAG_DIR}/patches/ksunext-integration.diff"

      - name: F1. Configure kernel (.config) with Exynos 850 Tweaks and run OriginSU v4.2.6 (35397) + SUSFS v2.3.0 preflight compilation
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.originsu.manager' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x51c' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || 'd91ed440459ff575f9bbdb0b294f8d679b1591a37538aafcf1d0073da5dbe968' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          exec > >(tee -a "${DIAG_DIR}/configure-build.log") 2>&1
          cd "${GITHUB_WORKSPACE}"

          make ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" "${DEFCONFIG}"

          scripts/config --file .config \
            --set-str LOCALVERSION "-Darknight" \
            --disable LOCALVERSION_AUTO \
            --enable COMPAT \
            --enable COMPAT_BINFMT_ELF \
            --enable COMPAT_OLD_SIGACTION \
            --enable COMPAT_32BIT_TIME \
            --enable USB_CONFIGFS \
            --enable USB_CONFIGFS_F_MTP \
            --enable USB_CONFIGFS_F_PTP \
            --enable USB_F_MTP \
            --enable USB_F_PTP \
            --enable CRYPTO_LZ4 \
            --enable CRYPTO_LZ4HC \
            --enable LZ4_COMPRESS \
            --enable LZ4HC_COMPRESS \
            --enable LZ4_DECOMPRESS \
            --enable ZRAM \
            --enable ZRAM_DEF_COMP_LZ4 \
            --set-str ZRAM_DEF_COMP "lz4" \
            --enable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
            --enable CPU_FREQ_GOV_CONSERVATIVE \
            --enable CPU_FREQ_GOV_ONDEMAND \
            --enable CPU_FREQ_GOV_USERSPACE \
            --enable CPU_FREQ_GOV_POWERSAVE \
            --enable CPU_FREQ_GOV_PERFORMANCE \
            --enable CPU_FREQ_GOV_ENERGYSTEP \
            --enable CPU_FREQ_GOV_SCHEDUTIL \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable CGROUP_BPF \
            --enable PSI \
            --enable OVERLAY_FS \
            --enable KSU \
            --enable KSU_DEBUG \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_HAS_MAGIC_MOUNT \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            --enable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --disable KSU_SUSFS_SUS_OVERLAYFS \
            --enable KSU_SUSFS_TRY_UMOUNT \
            --enable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_SUS_SU \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable FTRACE \
            --enable FTRACE_SYSCALLS \
            --enable HAVE_SYSCALL_TRACEPOINTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable SECURITY_SELINUX \
            --disable SECURITY_SELINUX_ALWAYS_PERMISSIVE \
            --disable SECURITY_SELINUX_DISABLE

          make ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig
          make ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" syncconfig
          make ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" prepare scripts

          # Generate SELinux flask.h and av_permissions.h required by non-GKI SELinux rules
          SELINUX_GENHDR="scripts/selinux/genheaders/genheaders"
          test -x "${SELINUX_GENHDR}"
          "${SELINUX_GENHDR}" security/selinux/flask.h security/selinux/av_permissions.h
          test -s security/selinux/flask.h
          test -s security/selinux/av_permissions.h

          cp -f .config "${DIAG_DIR}/final-kernel.config"
          grep -E "^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_FTRACE|CONFIG_HAVE_SYSCALL_TRACEPOINTS|CONFIG_KALLSYMS|CONFIG_SECURITY_SELINUX|CONFIG_LOCALVERSION)" .config \
            > "${DIAG_DIR}/config-summary.txt"
          cat "${DIAG_DIR}/config-summary.txt"

          grep -Fxq 'CONFIG_LOCALVERSION="-Darknight"' include/config/auto.conf
          grep -Fxq 'CONFIG_KSU=y' .config
          grep -Fxq 'CONFIG_KSU_SUSFS=y' .config
          grep -Fxq 'CONFIG_KALLSYMS=y' .config
          grep -Fxq 'CONFIG_KALLSYMS_ALL=y' .config
          ! grep -Fxq 'CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y' .config

          KREL="$(make -s ARCH="${ARCH}" kernelrelease)"
          echo "Verified make kernelrelease: ${KREL}"
          if [ "${KREL}" != "${EXPECTED_KERNEL_RELEASE}" ]; then
            echo "ERROR: Expected kernelrelease '${EXPECTED_KERNEL_RELEASE}', got '${KREL}'" >&2
            exit 1
          fi

          # Preflight compile of modified kernel files, fs/susfs.o, and drivers/kernelsu/
          make -j"$(nproc)" V=1 ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            KSU_MANAGER_PACKAGE="${INPUT_MGR_PKG}" \
            KSU_NEXT_MANAGER_SIZE="${INPUT_MGR_SIZE}" \
            KSU_NEXT_MANAGER_HASH="${INPUT_MGR_HASH}" \
            mm/maccess.o fs/namespace.o fs/susfs.o fs/exec.o fs/stat.o fs/readdir.o fs/proc/cmdline.o fs/proc/task_mmu.o kernel/reboot.o kernel/sys.o \
            drivers/soc/samsung/exynos-el3_mon.o drivers/cpufreq/exynos-acme.o drivers/soc/samsung/cal-if/vclk.o drivers/block/zram/zram_drv.o drivers/usb/gadget/function/f_mtp.o drivers/kernelsu/ \
            2>&1 | tee "${DIAG_DIR}/ksu-preflight-build.log"

          test -s fs/susfs.o
          test -s drivers/kernelsu/built-in.a
          find -L drivers/kernelsu -name "*.o" | sort > "${DIAG_DIR}/ksu-compiled-objects.txt"
          cat "${DIAG_DIR}/ksu-compiled-objects.txt"

      - name: F2. Build full arm64 Image and vmlinux and verify symbols/disassembly
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.originsu.manager' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x51c' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || 'd91ed440459ff575f9bbdb0b294f8d679b1591a37538aafcf1d0073da5dbe968' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          BUILD_START_EPOCH="$(date +%s)"
          make -j"$(nproc)" ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            KSU_MANAGER_PACKAGE="${INPUT_MGR_PKG}" \
            KSU_NEXT_MANAGER_SIZE="${INPUT_MGR_SIZE}" \
            KSU_NEXT_MANAGER_HASH="${INPUT_MGR_HASH}" \
            Image 2>&1 | tee "${DIAG_DIR}/kernel-build.log"

          IMAGE_PATH="${GITHUB_WORKSPACE}/arch/arm64/boot/Image"
          VMLINUX_PATH="${GITHUB_WORKSPACE}/vmlinux"
          test -s "${IMAGE_PATH}"
          test -s "${VMLINUX_PATH}"

          IMAGE_MTIME="$(stat -c %Y "${IMAGE_PATH}")"
          if [ "${IMAGE_MTIME}" -lt "${BUILD_START_EPOCH}" ]; then
            echo "ERROR: Built Image timestamp (${IMAGE_MTIME}) is older than build start (${BUILD_START_EPOCH})" >&2
            exit 1
          fi

          # Verify arm64 Image magic ("ARM\x64" at byte offset 56) and extract Linux version banner without llvm-strings SIGPIPE
          python3 - << 'PYEOF'
          import os, re
          from pathlib import Path

          diag = Path(os.environ["DIAG_DIR"])
          img = Path("arch/arm64/boot/Image").read_bytes()
          magic = img[56:60]
          assert magic == b"ARM\x64", f"Invalid ARM64 Image magic at offset 56: {magic!r}"
          m = re.search(rb"Linux version 4\.19\.325-Darknight[^\x00\n]+", img)
          assert m, "Release string 4.19.325-Darknight not found in Image"
          banner = m.group(0).decode("utf-8", errors="replace").strip()
          print("Verified ARM64 Image magic and embedded 4.19.325-Darknight release string.")
          print(banner)
          (diag / "kernel-image-version.txt").write_text(banner + "\n", encoding="utf-8")
          PYEOF

          # Audit vmlinux symbol table for mandatory KernelSU-Next and SUSFS symbols (redirect directly to file to avoid llvm-nm SIGPIPE)
          llvm-nm "${VMLINUX_PATH}" > "${DIAG_DIR}/vmlinux-all-symbols.txt"
          grep -E "(ksu_|kernelsu_|susfs_|track_throne|apply_kernelsu_rules|on_post_fs_data|phys_from_virt)" \
            "${DIAG_DIR}/vmlinux-all-symbols.txt" | sort > "${DIAG_DIR}/vmlinux-ksu-susfs-symbols.txt"

          for sym in \
            kernelsu_init \
            ksu_handle_sys_reboot \
            ksu_handle_setresuid \
            ksu_handle_execveat_ksud \
            ksu_disable_seccomp_for_manager \
            ksu_ensure_driver_fd_installed \
            ksu_handle_legacy_prctl \
            ksu_install_fd \
            track_throne \
            apply_kernelsu_rules \
            on_post_fs_data \
            phys_from_virt \
            ksu_patch_text \
            susfs_init \
            susfs_spoof_uname \
            susfs_add_sus_path; do
            if ! awk -v s="${sym}" '$3 == s {found=1} END {exit !found}' "${DIAG_DIR}/vmlinux-ksu-susfs-symbols.txt"; then
              echo "ERROR: Mandatory symbol '${sym}' missing from vmlinux!" >&2
              exit 1
            fi
          done

          # Extract __arm64_sys_reboot and ksu_patch_text_cb addresses from vmlinux-all-symbols.txt (zero llvm-nm pipes!)
          REBOOT_HEX="$(awk '$3 == "__arm64_sys_reboot" {print $1; exit}' "${DIAG_DIR}/vmlinux-all-symbols.txt")"
          PATCH_CB_HEX="$(awk '$3 == "ksu_patch_text_cb" {print $1; exit}' "${DIAG_DIR}/vmlinux-all-symbols.txt")"
          rm -f "${DIAG_DIR}/vmlinux-all-symbols.txt"
          test -n "${REBOOT_HEX}"
          test -n "${PATCH_CB_HEX}"
          REBOOT_VA="0x${REBOOT_HEX}"
          REBOOT_END="$(python3 -c "print(hex(int('${REBOOT_VA}', 16) + 0x120))")"
          PATCH_CB_VA="0x${PATCH_CB_HEX}"
          PATCH_CB_END="$(python3 -c "print(hex(int('${PATCH_CB_VA}', 16) + 0x180))")"

          # Disassemble __arm64_sys_reboot directly to file to prove direct call to ksu_handle_sys_reboot
          llvm-objdump -d --start-address="${REBOOT_VA}" --stop-address="${REBOOT_END}" \
            "${VMLINUX_PATH}" > "${DIAG_DIR}/reboot-disasm.txt"
          cat "${DIAG_DIR}/reboot-disasm.txt"
          grep -q "ksu_handle_sys_reboot" "${DIAG_DIR}/reboot-disasm.txt"

          # Disassemble ksu_patch_text_cb to prove memcpy is used instead of broken copy_to_kernel_nofault
          llvm-objdump -d --start-address="${PATCH_CB_VA}" --stop-address="${PATCH_CB_END}" \
            "${VMLINUX_PATH}" > "${DIAG_DIR}/patch-text-cb-disasm.txt"
          cat "${DIAG_DIR}/patch-text-cb-disasm.txt"
          grep -q "memcpy" "${DIAG_DIR}/patch-text-cb-disasm.txt"
          ! grep -q "copy_to_kernel_nofault" "${DIAG_DIR}/patch-text-cb-disasm.txt"

          BUILT_IMAGE_SHA256="$(sha256sum "${IMAGE_PATH}" | awk '{print $1}')"
          echo "${BUILT_IMAGE_SHA256}  arch/arm64/boot/Image" | tee "${DIAG_DIR}/built-image.sha256"
          echo "BUILT_IMAGE_SHA256=${BUILT_IMAGE_SHA256}" >> "${GITHUB_ENV}"

      - name: G. Package OriginSU-style AnyKernel3 installer and validate scripts/hashes
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.originsu.manager' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x51c' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || 'd91ed440459ff575f9bbdb0b294f8d679b1591a37538aafcf1d0073da5dbe968' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          AK3_DIR="${RUNNER_TEMP}/AnyKernel3"
          rm -rf "${AK3_DIR}"
          git clone --depth=1 "${ANYKERNEL_REPO}" "${AK3_DIR}"
          rm -rf "${AK3_DIR}/.git" "${AK3_DIR}/modules" "${AK3_DIR}/patch" "${AK3_DIR}/ramdisk"

          cp -f "${GITHUB_WORKSPACE}/arch/arm64/boot/Image" "${AK3_DIR}/Image"

          # Bundle OriginSU v4.2.6 (35397) 64-bit (arm64-v8a) & 32-bit (armeabi-v7a) daemons into AnyKernel3
          ORIGINSU_APK="${RUNNER_TEMP}/OriginSU-universal.apk"
          if curl -fsSL --retry 3 "https://github.com/samakshkambxj/OriginSU/releases/download/v4.2.6/OriginSU_v4.2.6_35397-universal-release.apk" -o "${ORIGINSU_APK}" || \
             curl -fsSL --retry 3 "https://github.com/samakshkambxj/OriginSU/releases/download/v4.2.6/OriginSU_v4.2.6_35397-arm64-v8a-release.apk" -o "${ORIGINSU_APK}"; then
            unzip -p "${ORIGINSU_APK}" lib/arm64-v8a/libksud.so > "${AK3_DIR}/ksud"
            unzip -p "${ORIGINSU_APK}" lib/arm64-v8a/libadbroot.so > "${AK3_DIR}/libadbroot.so"
            unzip -p "${ORIGINSU_APK}" lib/armeabi-v7a/libksud.so > "${AK3_DIR}/ksud32" 2>/dev/null || true
            chmod 0755 "${AK3_DIR}/ksud" "${AK3_DIR}/libadbroot.so"
            [ -f "${AK3_DIR}/ksud32" ] && chmod 0755 "${AK3_DIR}/ksud32"
          fi

          cat << 'EOF' > "${AK3_DIR}/anykernel.sh"
          ### AnyKernel3 Ramdisk Mod Script
          ## Darknight 4.19.325 (OriginSU v4.2.6 35397 + SUSFS v2.3.0 + Tweaks) for Galaxy A13 4G (SM-A135F/M)
          ## Supports Stock ROM, Port ROM, GSI, AOSP (Android 13 - 17, 32-bit & 64-bit Dual ABI)

          properties() { '
          kernel.string=Darknight 4.19.325 (OriginSU v4.2.6 35397 + SUSFS v2.3.0 + OC/UC 130-2210MHz + LZ4)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          if [ ! -e "$BLOCK" ] && [ -e "/dev/block/platform/12100000.dwmmc0/by-name/boot" ]; then
            BLOCK="/dev/block/platform/12100000.dwmmc0/by-name/boot"
          fi
          [ -e "$BLOCK" ] || abort "Boot partition block device ($BLOCK) not found. Aborting."

          # Attempt non-fatal rollback backup before modifying boot partition
          for bak_dir in /sdcard/Download /data/media/0/Download /tmp; do
            if [ -d "$bak_dir" ] && [ -w "$bak_dir" ]; then
              if dd if="$BLOCK" of="$bak_dir/boot-backup-pre-Darknight.img" bs=4096 2>/dev/null; then
                ui_print "Saved rollback boot backup: $bak_dir/boot-backup-pre-Darknight.img"
                break
              fi
            fi
          done

          # Install OriginSU v4.2.6 (35397) 64-bit & 32-bit daemons to /data/adb/ksud
          mount /data 2>/dev/null || true
          if [ -d /data ] && [ -w /data ]; then
            mkdir -p /data/adb/ksu/bin /data/adb/ksu/lib /data/adb/ksu/log /data/adb/modules
            chmod 0700 /data/adb
            rm -f /data/adb/ksu/bin/ksud_official /data/adb/ksu/bin/ksud_next
            if [ -f "$home/ksud" ]; then
              cp -f "$home/ksud" /data/adb/ksud
              cp -f "$home/ksud" /data/adb/ksu/bin/ksud
              ui_print "Installed OriginSU v4.2.6 (35397) 64-bit daemon -> /data/adb/ksud"
            fi
            if [ -f "$home/ksud32" ]; then
              cp -f "$home/ksud32" /data/adb/ksu/bin/ksud32
              ui_print "Installed OriginSU v4.2.6 (35397) 32-bit daemon -> /data/adb/ksu/bin/ksud32"
            fi
            chown 0:0 /data/adb/ksud /data/adb/ksu/bin/ksud* 2>/dev/null || true
            chmod 0755 /data/adb/ksud /data/adb/ksu/bin/ksud* 2>/dev/null || true
            chcon u:object_r:adb_data_file:s0 /data/adb/ksud /data/adb/ksu/bin/ksud* 2>/dev/null || true
            if [ -f "$home/libadbroot.so" ]; then
              cp -f "$home/libadbroot.so" /data/adb/ksu/lib/libadbroot.so
              chown 0:0 /data/adb/ksu/lib/libadbroot.so 2>/dev/null || true
              chmod 0755 /data/adb/ksu/lib/libadbroot.so
              chcon u:object_r:adb_data_file:s0 /data/adb/ksu/lib/libadbroot.so 2>/dev/null || true
            fi
          fi

          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' "${AK3_DIR}/anykernel.sh"
          chmod 0755 "${AK3_DIR}/anykernel.sh"

          cat << 'EOF' > "${AK3_DIR}/ROLLBACK.md"
          # Rollback Plan — Samsung Galaxy A13 4G (SM-A135F)

          1. **Automatic Backup During Flash**:
             The installer attempts to dump your current `/dev/block/by-name/boot` partition to:
             - `/sdcard/Download/boot-backup-pre-Darknight.img` (or `/tmp/boot-backup-pre-Darknight.img` in recovery).
          2. **Restore via TWRP / OrangeFox Recovery**:
             - Reboot to Recovery -> **Install** -> **Install Image** -> select `boot-backup-pre-Darknight.img` -> target **Boot** partition -> Swipe to flash, or
             - Flash your previous working AnyKernel3 ZIP (e.g. `Originkernel.zip`).
          3. **Restore via Odin / Heimdall (Download Mode)**:
             - Pack your stock/working `boot.img` (`tar -H ustar -cf boot-restore.tar boot.img`) and flash in Odin `AP` slot.
          EOF
          sed -i 's/^          //' "${AK3_DIR}/ROLLBACK.md"

          python3 - << 'PYEOF'
          import json, os, time
          from pathlib import Path

          meta = {
              "device_model": "SM-A135F",
              "soc": "exynos850 (universal3830)",
              "kernel_release": os.environ["EXPECTED_KERNEL_RELEASE"],
              "kernel_source_repo": os.environ["KERNEL_REPO"],
              "kernel_source_branch": os.environ["KERNEL_BRANCH"],
              "kernel_source_commit": Path(os.environ["DIAG_DIR"], "kernel-source-commit.txt").read_text().strip(),
              "defconfig": os.environ["DEFCONFIG"],
              "toolchain_neutron_tag": os.environ["NEUTRON_TAG"],
              "ksunext_repo": os.environ["KSUNEXT_REPO"],
              "ksunext_commit": os.environ["KSUNEXT_COMMIT"],
              "ksunext_tag": os.environ["KSUNEXT_TAG"],
              "ksunext_driver_version": int(os.environ["KSUNEXT_VERSION"]),
              "originsu_release_url": os.environ.get("ORIGINSU_RELEASE_URL", "https://github.com/samakshkambxj/OriginSU/releases/tag/v4.2.6"),
              "originsu_full_version": os.environ.get("ORIGINSU_FULL_VERSION", "v4.2.6-f9d89712@OriginSU"),
              "originsu_uapi_version": int(os.environ.get("ORIGINSU_UAPI_VERSION", "6")),
              "ksu_manager_package": os.environ["INPUT_MGR_PKG"],
              "ksu_manager_cert_size": os.environ["INPUT_MGR_SIZE"],
              "ksu_manager_cert_sha256": os.environ["INPUT_MGR_HASH"],
              "susfs_userspace_repo": os.environ["BRENE_REPO"],
              "susfs_userspace_commit": os.environ["BRENE_SHA"],
              "susfs_kernel_repo": os.environ["SUSFS4KSU_REPO"],
              "susfs_kernel_branch": os.environ["SUSFS4KSU_BRANCH"],
              "susfs_kernel_commit": os.environ["SUSFS4KSU_SHA"],
              "built_image_sha256": os.environ["BUILT_IMAGE_SHA256"],
              "build_timestamp_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "runtime_verification_status": "NOT TESTED (CI build & static/binary audit only; requires on-device flash test)",
          }
          out_json = json.dumps(meta, indent=2) + "\n"
          Path(os.environ["DIAG_DIR"], "build-metadata.json").write_text(out_json, encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"], "AnyKernel3", "build-metadata.json").write_text(out_json, encoding="utf-8")
          PYEOF

          bash -n "${AK3_DIR}/anykernel.sh"
          bash -n "${AK3_DIR}/META-INF/com/google/android/update-binary"
          shellcheck -s sh -S error "${AK3_DIR}/anykernel.sh" || true

          cd "${AK3_DIR}"
          sha256sum Image anykernel.sh build-metadata.json ROLLBACK.md > SHA256SUMS.txt
          ZIP_NAME="A13X-Darknight-OriginSU-v4.2.6-35397-SUSFS-Tweaks-AnyKernel3.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"
          rm -f "${ZIP_PATH}"
          zip -r9 "${ZIP_PATH}" . -x '*/.git/*' '*/README*' '*placeholder'

          unzip -t "${ZIP_PATH}" > "${DIAG_DIR}/zip-integrity-test.txt"
          UNPACK_TEST_DIR="${RUNNER_TEMP}/verify-zip"
          rm -rf "${UNPACK_TEST_DIR}"
          mkdir -p "${UNPACK_TEST_DIR}"
          unzip -q "${ZIP_PATH}" -d "${UNPACK_TEST_DIR}"

          ZIP_IMAGE_SHA256="$(sha256sum "${UNPACK_TEST_DIR}/Image" | awk '{print $1}')"
          if [ "${ZIP_IMAGE_SHA256}" != "${BUILT_IMAGE_SHA256}" ]; then
            echo "ERROR: Packaged Image SHA-256 (${ZIP_IMAGE_SHA256}) != Built Image SHA-256 (${BUILT_IMAGE_SHA256})" >&2
            exit 1
          fi

          ZIP_SHA256="$(sha256sum "${ZIP_PATH}" | awk '{print $1}')"
          echo "${ZIP_SHA256}  ${ZIP_NAME}" | tee "${DIAG_DIR}/installer-zip.sha256"
          cp -f "${AK3_DIR}/anykernel.sh" "${DIAG_DIR}/anykernel.sh"
          cp -f "${AK3_DIR}/SHA256SUMS.txt" "${DIAG_DIR}/SHA256SUMS.txt"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: H1. Upload Flashable AnyKernel3 Installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A13X-Darknight-OriginSU-v4.2.6-35397-SUSFS-Tweaks-AnyKernel3
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: H2. Upload Build Diagnostics, Metadata, and Patch Diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A13X-Darknight-v15-Build-Diagnostics-${{ github.run_id }}
          path: ${{ github.workspace }}/diagnostics/
          if-no-files-found: warn
